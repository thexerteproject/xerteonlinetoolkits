/* TODO **
- new option needed to allow correct answer to be shown when answers submitted
- Mark Answers is called Judge Questions in xwd - need consistency - but Mark Answers feels less clear
- condition="parent.judge!='false'" - this condition used to be on option > correct but it doesn't work as parent is question not page - add page.x to editor code for this to work
- if quiz can be restarted & shuffle is on, more questions can end up being tracked than the max question no.
 */

	// pageChanged & sizeChanged functions are needed in every model file
	// other functions for model should also be in here to avoid conflicts
	var quiz = new function() {
		// function called every time the page is viewed after it has initially loaded
		this.pageChanged = function() {
			const $pageContents = $("#pageContents");
			this.questions = $pageContents.data("questions");
			this.currentAnswers = $pageContents.data("currentAnswers");
			this.currentQ = $pageContents.data("currentQ");
			this.myProgress = $pageContents.data("myProgress");
			this.tracked = $pageContents.data("tracked");

            if ($("#vidHolder").length > 0) {
				this.loadVideo();
			}
		};

		// function called every time the size of the LO is changed
		this.sizeChanged = function() {
			// panel will be fixed height (100% of available height) if panel style is on, unless there is text above &/or below the panel
			const panelH = XENITH.SPLITSCREEN.resizePanel();

			// this will be used later when showing feedback - it is done differently depending on whether content is centred vertically on the page & whether panel is full height
			$("#pageContents").data("slideIn", x_checkVerticalCentre() && panelH === false);

			if ($("#vidHolder").length > 0) {
				this.loadVideo();
			}
			
			var resized = false;
			if ($("#questionAudio").children().length > 0) {
				if (resized == false) {
					var audioBarW = 0;
					$("#questionAudio").find(".mejs-inner").find(".mejs-controls").children().each(function() {
						audioBarW += $(this).outerWidth();
					});
					if (audioBarW < $("#questionAudio").width() - 5 || audioBarW > $("#questionAudio").width() + 5) {
						resized = true;
						$x_window.resize();
					}
				}
			}
			if ($("#pageContents .audioHolder").length > 0) {
				if (resized == false) {
					var audioBarW = 0;
					$("#pageContents .audioHolder:eq(0) .mejs-inner .mejs-controls").children().each(function() {
						audioBarW += $(this).outerWidth();
					});
					if (audioBarW - $("#pageContents .audioHolder").parents("#mainPanel").width() < -2 || audioBarW - $("#pageContents .audioHolder").parents("#mainPanel").width() > 2) {
						resized = true;
						$x_window.resize();
					}
				}
			}
		};

		this.leavePage = function() {
			$("#pageContents").data({
				questions: this.questions,
				currentAnswers: this.currentAnswers,
				currentQ: this.currentQ,
				myProgress: this.myProgress,
				tracked: this.tracked
			});
		}

		this.startQs = function() {
			$("#feedbackGroup").find('.feedbackBlock').html("");
			$(".correctFeedback, .incorrectFeedback").removeClass("correctFeedback incorrectFeedback");
			$("#optionHolder").removeClass("hidden");
			$("#checkBtn, #nextBtn, #restartBtn").button("disable");
			
            this.currentQ = 0;
			this.questions = []; // array of questions to use (index)
			this.myProgress = []; // array of whether each question was answered correctly
			var numQs = $(x_currentPageXML).children().length;
			if (x_currentPageXML.getAttribute("numQuestions") != undefined && x_currentPageXML.getAttribute("numQuestions") != "All" && x_currentPageXML.getAttribute("numQuestions") != "*" && $.isNumeric(x_currentPageXML.getAttribute("numQuestions")) && Math.max(1, Number(x_currentPageXML.getAttribute("numQuestions"))) < numQs) {
				numQs = Math.max(1,Number(x_currentPageXML.getAttribute("numQuestions")));
			}

			if (x_currentPageXML.getAttribute("order") == "random") {
				var qNums = [];
				for (var i=0; i<$(x_currentPageXML).children().length; i++) {
					qNums.push(i);
				}
				x_shuffleArray(qNums);
				this.questions = qNums.slice(0, numQs);
			} else {
				for (var i=0; i<numQs; i++) {
					this.questions.push(i);
					this.myProgress.push("");
				}
			}

			const weighting = x_calculateWeight(x_currentPageXML.getAttribute("trackingWeight"), x_currentPageXML.getAttribute("judge"));
            XTSetPageType(x_currentPage, 'numeric', numQs, weighting);

			this.currentAnswers = [];

			// get answer options etc. for all questions now & set up tracking
			// do now instead of when each question is shown as otherwise the answers won't all show on results page if not completed in the first view of the page
			const correctOptions = [];
			const correctFeedback = [];
			const correctAnswer = [];

			for (let i=0; i<this.questions.length; i++) {
				this.currentAnswers.push([]);
				correctOptions.push([]);
				correctFeedback.push([]);
				correctAnswer.push([]);

				var $thisQ = $(x_currentPageXML).children()[this.questions[i]];

				$($thisQ).children().each(function() {
					var label;
					if (this.getAttribute("name") == undefined || this.getAttribute("name")=="")
					{
						label = $("<div>").html(this.getAttribute("text")).text();
					}
					else
					{
						label = this.getAttribute("name");
					}
					quiz.currentAnswers[i].push({
						text:		this.getAttribute("text"),
						name:       label,
						correct:	this.getAttribute("correct"),
						feedback:	this.getAttribute("feedback"),
						audioFB:	this.getAttribute("audioFB"),
						transcript:	this.getAttribute("audioTranscript") != undefined && this.getAttribute("audioTranscript") != '' ? this.getAttribute("audioTranscript") : false
					});
				});

				// Randomise the answers, if required
				if ($thisQ.getAttribute("answerOrder") == 'random') {
					for (var tmp, j, k, l = this.currentAnswers[i].length, m = l; m--;) {
						j = Math.floor(Math.random() * l);
						k = Math.floor(Math.random() * l);
						tmp = this.currentAnswers[i][j];
						this.currentAnswers[i][j] = this.currentAnswers[i][k];
						this.currentAnswers[i][k] = tmp;
					}
				}

				$.each(this.currentAnswers[i], function(j, thisOption) {
					correctOptions[i].push({
						id: (j + 1) + "",
						answer: thisOption.name,
						result: thisOption.correct == 'true'
					});
					if (thisOption.correct == 'true') {
						correctAnswer[i].push(thisOption.name);
					}
					correctFeedback[i].push(thisOption.feedback);
				});

				const name = $thisQ.getAttribute("name") ? $thisQ.getAttribute("name") : $thisQ.getAttribute("prompt");

				XTEnterInteraction(x_currentPage, this.questions[i], 'multiplechoice', name, correctOptions[i], correctAnswer[i], correctFeedback[i], x_currentPageXML.getAttribute("grouping"));
			}

			this.loadQ();

			x_pageContentsUpdated();
		};

		this.loadQ = function() {
		    // Reset tracking flag
			this.tracked = false;

			if ($(x_currentPageXML).children().length == 0) {
				$("#optionHolder").html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noQ", "No questions have been added") + '</span>');
				
			} else {

				var $thisQ = $(x_currentPageXML).children()[this.questions[this.currentQ]];

				// if language attributes aren't in xml will have to use english fall back
				if ($("#qNo").length > 0) {
					const qNoTxt = x_currentPageXML.getAttribute("quesCount") == undefined ? "Question {i} of {n}" : x_currentPageXML.getAttribute("quesCount");
					$("#qNo").html(qNoTxt.replace("{i}", this.currentQ + 1).replace("{n}", this.questions.length));
				}

				var infoString = $thisQ.getAttribute("prompt");

				const transcript = $thisQ.getAttribute("soundTranscript") != undefined && $thisQ.getAttribute("soundTranscript") != '' ? $thisQ.getAttribute("soundTranscript") : false;
				quiz.loadAudio($("#questionAudio"), $thisQ.getAttribute("sound"), transcript);

				var url = $thisQ.getAttribute("image");
				if (url != undefined && url != "") {
					var newString = "";
					if ($thisQ.getAttribute("caption") != undefined && $thisQ.getAttribute("caption") != "") {
						newString += '<figure class="qImgHolder">';
					} else {
						newString += '<div class="qImgHolder">';
					}
					newString += '<img src="' + x_evalURL(url) + '" class="quizImg"';
					if ($thisQ.getAttribute("tip") != undefined && $thisQ.getAttribute("tip") != "") {
						newString += ' alt="' + $thisQ.getAttribute("tip") + '"';
					}
					newString += ' />';
					if ($thisQ.getAttribute("caption") != undefined && $thisQ.getAttribute("caption") != "") {
						newString += '<figcaption>' + $thisQ.getAttribute("caption") + '</figcaption></figure>';
					} else {
						newString += '</div>';
					}
					infoString = newString + infoString;
				}
				$("#qTxt").html(x_addLineBreaks(infoString));

				if ($($thisQ).children().length == 0) {
					$("#optionHolder").html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noA", "No answer options have been added") + '</span>');
				} else {
					var $optionHolder = $("#optionHolder");
					if ($thisQ.getAttribute("type") == "Multiple Answer") {
						$optionHolder.removeClass("answerBtn")
						$optionHolder.html('<div class="optionGroup"><input type="checkbox" name="option" /><label class="optionTxt"></label></div>');
					} else if ($thisQ.getAttribute("answerType") == "button") {
						$optionHolder
								.addClass("answerBtn")
								.html('<div class="optionGroup answerBtn"><input type="checkbox" name="option" /><label class="optionTxt"></label></div>');
					} else {
						$optionHolder.removeClass("answerBtn")
						$optionHolder.html('<div class="optionGroup"><input type="radio" name="option" /><label class="optionTxt"></label></div>');
					}
					var $optionGroup = $optionHolder.find(".optionGroup"),
						$checkBtn = $("#checkBtn");

					$.each(this.currentAnswers[this.currentQ], function(i, thisOption) {
							var $thisOptionGroup, $thisOption, $thisOptionTxt;
							if (i != 0) {
								$thisOptionGroup = $optionGroup.clone().appendTo($optionHolder);
							} else {
								$thisOptionGroup = $optionGroup;
							}

							if ($thisOptionGroup.hasClass("answerBtn")) {
								$thisOptionGroup.button();
							}

							$thisOption = $thisOptionGroup.find("input");
							$thisOptionTxt = $thisOptionGroup.find(".optionTxt");
								
							quiz.currNrOptions = i+1;

							$thisOption
								.attr({
									"value"	:thisOption.text,
									"id"	:"option" + i
									})
								.data("correct", thisOption.correct)
								.change(function() {
									const $selected = $("#optionHolder input:checked");
									$("#feedbackGroup").find('.feedbackBlock').html("");
									$(".correctFeedback, .incorrectFeedback").removeClass("correctFeedback incorrectFeedback");
									$("#nextBtn").button("disable");

									if (!$thisOptionGroup.hasClass("answerBtn")) {
										// radio button / checkbox
										if ($selected.length > 0) {
											$checkBtn.button("enable");
										} else {
											$checkBtn.button("disable");
										}

									} else if ($selected.length > 0) {
										// toggle button
										if ($selected.length > 1) {
											$selected.not($(this))
													.prop("checked", false)
													.parents(".answerBtn").removeClass("selected");
										}
										$(this).parents(".answerBtn").addClass("selected");
										quiz.showFeedBackandTrackResults();
										quiz.checked = true;

									} else if ($(".answerBtn.selected").length > 0) {
										$(".answerBtn.selected").removeClass("selected");
									}
								});

							if ($thisQ.getAttribute("type") == "Multiple Answer" || $thisQ.getAttribute("answerType") !== "button") {
								$thisOption
										.focusin(function () {
											$thisOptionGroup.addClass("highlight");
										})
										.focusout(function () {
											$thisOptionGroup.removeClass("highlight");
										});
							} else {
								$thisOption
										.focusin(function () {
											$thisOptionGroup.addClass("ui-state-focus");
										})
										.focusout(function () {
											$thisOptionGroup.removeClass("ui-state-focus");
										});
							}

							$thisOptionTxt
								.attr("for", "option" + i)
								.data("option", $thisOption)
								.html(x_addLineBreaks(thisOption.text));
						});

					quiz.checked = false;
					if ($("#qNo").length > 0) {
						$('#qNo').attr('tabIndex', "-1").focus();
					}
				}
			}
		}

		this.isCorrect = function(currentQuestion) {
			const judge = x_checkIfJudged(x_currentPageXML.getAttribute("judge"));
			let judgeOverride = judge;

			var selected = $("#optionHolder input:checked"),
					correct = true,
					l_options = [],
					l_answer = [],
					l_feedback = [],
					l_selectedOptions = [];

			const currentQuestionsChildren = $($(x_currentPageXML).children()[this.questions[this.currentQ]]).children();

			let correctCounter = 0;
			if (judge) {
				for (i = 0; i < currentQuestionsChildren.length; i++) {
					if (currentQuestionsChildren[i].getAttribute("correct") == 'true') {
						correctCounter++;
					}
				}
				if (selected.length == 0 && correctCounter > 0) {
					correct = false;
				} else if (correctCounter === 0) {
					// a question with no correct answers, within a judged quiz, will be treated as a non-judged question
					judgeOverride = false;
				}
			} else if (selected.length == 0) {
				// if judge is off, any submitted answer will be marked as correct
				correct = false;
			}

			// get feedback for selected options and check if they are correct
			for (var i=0; i<selected.length; i++) {
				var optionIndex = $(selected[i]).parents(".optionGroup").index(),
					selectedOption = quiz.currentAnswers[this.currentQ][optionIndex];

				if (judge && correctCounter > 0) {
					correct = correct && selectedOption.correct === "true";
				}

				l_options.push({
					id: optionIndex+1+"",
					answer: selectedOption.name,
					result: selectedOption.correct === "true"
				});
				l_answer.push(selectedOption.name);
				l_feedback.push(selectedOption.feedback);
				l_selectedOptions.push(selectedOption);
			}

			// if all selected are correct - check that none of the unselected options should have been
			if (judge && correct && currentQuestion.getAttribute("type") == "Multiple Answer") {
				var notSelected = $("#optionHolder input:not(:checked)");
				for (var i=0; i<notSelected.length; i++) {
					var notSelectedOption = quiz.currentAnswers[quiz.currentQ][$(notSelected[i]).parents(".optionGroup").index()];
					if (notSelectedOption.correct == "true") {
						correct = false;
					}
				}
			}

			return {
				correct: correct,
				options: l_options,
				answer: l_answer,
				feedback: l_feedback,
				selectedOption: l_selectedOptions,
				judgeOverride: judgeOverride
			};
		}

        this.showFeedBackandTrackResults = function() {
			// are submitted answers going to be judged against correct answers or is it collecting opinions only?
			let judge = x_checkIfJudged(x_currentPageXML.getAttribute("judge"));

			var currentQuestion = $(x_currentPageXML).children()[quiz.questions[quiz.currentQ]];

			const trackData = this.isCorrect(currentQuestion);
			if (judge && !trackData.judgeOverride) {
				judge = trackData.judgeOverride;
			}

			// Track answer
			var result = {
				success: trackData.correct,
				score: trackData.correct ? 100.0 : 0.0,
				judge: judge
			};

			XTExitInteraction(x_currentPage, quiz.questions[quiz.currentQ], result, trackData.options, trackData.answer, trackData.feedback, x_currentPageXML.getAttribute("trackinglabel"));

			quiz.myProgress.splice(quiz.currentQ, 1, trackData.correct);

			var myScore = 0;
			for (var i=0; i<quiz.myProgress.length; i++) {
				if (quiz.myProgress[i] == true) {
					myScore++;
				}
			}

			const score = Math.round((myScore * 100 / quiz.questions.length) * 100)/100;
			XTSetPageScore(x_currentPage, score, quiz.currentQ+1 == quiz.questions.length);

			if (trackData.selectedOption.length > 0) {
				this.tracked = true;
				var currentQuestion = $(x_currentPageXML).children()[this.questions[this.currentQ]];
				var thisQ = $(x_currentPageXML).children()[this.questions[this.currentQ]];
				const correct = trackData.correct;

				var rightWrongTxt = "";
				if (judge) {
					// add correct feedback depending on if question overall has been answered correctly or not
					if (currentQuestion.getAttribute("type") == "Multiple Answer") {
						if (correct == true) {
							$("#feedbackGroup").addClass("correctFeedback");
							rightWrongTxt = '<p>' + $("#pageContents").data("multiRight") + '</p>';
						} else {
							$("#feedbackGroup").addClass("incorrectFeedback");
							rightWrongTxt = '<p>' + $("#pageContents").data("multiWrong") + '</p>';
						}
					} else {
						if (correct == true) {
							$("#feedbackGroup").addClass("correctFeedback");
							rightWrongTxt = '<p>' + $("#pageContents").data("singleRight") + '</p>';
						} else {
							$("#feedbackGroup").addClass("incorrectFeedback");
							rightWrongTxt = '<p>' + $("#pageContents").data("singleWrong") + '</p>';
						}
					}
				}

				var feedbackDiv = ['top', 'middle', 'bottom'],
						feedbackOrder = thisQ.getAttribute('feedbackPos') == undefined ? 'GAC' : thisQ.getAttribute('feedbackPos');

				feedbackOrder = [...feedbackOrder];

				// show the feedback in the order specified
				// feedback will include correctFeedback / incorrectFeedback classes that can be used in themes to style feedback differently
				const showfeedback = x_currentPageXML.getAttribute("showfeedback") != undefined ? x_currentPageXML.getAttribute("showfeedback") == "true" : true;
				if (showfeedback) {
					if (thisQ.getAttribute("type") != "Multiple Answer") {
						for (var i = 0; i < feedbackDiv.length; i++) {
							var thisFeedback;
							if (feedbackOrder[i] == 'G') {
								thisFeedback = thisQ.getAttribute('feedback');
							} else if (feedbackOrder[i] == 'A') {
								if (trackData.selectedOption !== undefined && trackData.selectedOption[0] !== undefined && trackData.selectedOption[0] !== null) {
									const selectedOption = trackData.selectedOption[0];
									thisFeedback = selectedOption.feedback;
									if (selectedOption.audioFB != undefined && selectedOption.audioFB != "") {
										thisFeedback += '<div class="audioHolder" data-audio="' + selectedOption.audioFB + '" data-transcript="' + selectedOption.transcript + '"></div>';
									}
									if (judge && thisFeedback != "") {
										thisFeedback = '<div class="' + (selectedOption.correct == 'true' ? 'correct' : 'incorrect') + 'Feedback">' + thisFeedback + '</div>';
									}
								}
							} else {
								thisFeedback = rightWrongTxt;
							}

							// to avoid a sudden jump in layout, feedback should slide in gradually if content is centred vertically & panel is full height
							if ($("#pageContents").data("slideIn")) {
								$('#' + feedbackDiv[i] + 'Feedback')
										.hide()
										.html(thisFeedback)
										.slideDown();
							} else {
								$('#' + feedbackDiv[i] + 'Feedback')
										.show()
										.html(thisFeedback);
							}
						}

						var feedbackLabel = x_currentPageXML.getAttribute("feedbackLabel");
						if (feedbackLabel == undefined) {
							feedbackLabel = "Feedback";
						}
						$("#feedbackHeader").html(feedbackLabel != '' ? "<h3>" + feedbackLabel + "</h3>" : '');

					} else {
						for (var p = 0; p < feedbackDiv.length; p++) {
							var thisFeedback;
							if (feedbackOrder[p] == 'G') {
								thisFeedback = thisQ.getAttribute('feedback');

							} else if (feedbackOrder[p] == 'A') {
								let feedback = "";
								for (var l = 0; l < trackData.selectedOption.length; l++) {
									const selectedOption = trackData.selectedOption[l];
									let thisFeedback = selectedOption.feedback;
									if (selectedOption.audioFB != undefined && selectedOption.audioFB != "") {
										thisFeedback += '<div class="audioHolder" data-audio="' + selectedOption.audioFB + '" data-transcript="' + selectedOption.transcript + '"></div>';
									}
									if (judge && thisFeedback != "") {
										thisFeedback = '<div class="' + (selectedOption.correct == 'true' ? 'correct' : 'incorrect') + 'Feedback">' + thisFeedback + '</div>';
									}
									feedback += thisFeedback;
								}
								thisFeedback = feedback;

							} else {
								thisFeedback = rightWrongTxt;
							}

                            // to avoid a sudden jump in layout, feedback should slide in gradually if content is centred vertically & panel is full height
                            if ($("#pageContents").data("slideIn")) {
                                $('#' + feedbackDiv[p] + 'Feedback')
                                        .hide()
                                        .html(thisFeedback)
                                        .slideDown();
                            } else {
                                $('#' + feedbackDiv[p] + 'Feedback')
                                        .show()
                                        .html(thisFeedback);
                            }
                        }

                        var feedbackLabel = x_currentPageXML.getAttribute("feedbackLabel");
                        if (feedbackLabel == undefined) {
                            feedbackLabel = "Feedback";
                        }

                        $("#feedbackHeader").html(feedbackLabel != '' ? "<h3>" + feedbackLabel + "</h3>" : '');
                    }

                    $('#feedbackGroup').find('.audioHolder').each(function() {
                        quiz.loadAudio($(this), $(this).data('audio'), $(this).data('transcript'));
                    });

                    $("#nextBtn").button("enable");
                    $("#checkBtn").button("disable");

					if (!x_multipleAttemptsAllowed()) {
						// Disable all options
						var i = 0;
						for (i = 0; i < quiz.currNrOptions; i++) {
							$("#option" + i).attr("disabled", "disabled");
						}
					}

					// scroll to the buttonHolder div so there is less chance of feedback being completely off screen
					// not scrolling to feedback directly so the buttons won't be out of sight
					$("#mainPanel").animate({
						scrollTop: $("#mainPanel").scrollTop() - $("#mainPanel").offset().top + $("#buttonHolder").offset().top
					}, 500);

				} else {
					$("#checkBtn").button("disable");
					this.nextQuestion();
				}
			}

			x_pageContentsUpdated();
        }

		this.nextQuestion = function() {
			// scroll back to top of panel
			$("#mainPanel").animate({scrollTop: 0}, 0);

			// Continue to next question
			quiz.currentQ++;
			if (quiz.currentQ == quiz.questions.length) {
				// last question answered - show results
				quiz.showResults();
			} else {
				quiz.loadQ();
			}
		}

        this.showResults = function() {
            // last question answered - show results
            var $pageContents = $("#pageContents");
            $("#qNo").html($pageContents.data("onCompletionText"));
            var fbTxt = "<div>" + x_addLineBreaks(x_currentPageXML.getAttribute("feedback")) + "</div>";

            var myScore = 0;
            for (var i=0; i<quiz.myProgress.length; i++) {
                if (quiz.myProgress[i] == true) {
                    myScore++;
                }
            }
            if (x_checkIfJudged(x_currentPageXML.getAttribute("judge"))) {
				if (x_currentPageXML.getAttribute("scorePos") == "Above") {
					fbTxt = "<p>" + $pageContents.data("scoreText").replace("{i}", myScore).replace("{n}", quiz.questions.length) + "</p>" + fbTxt;
				} else {
					fbTxt += "<p>" + $pageContents.data("scoreText").replace("{i}", myScore).replace("{n}", quiz.questions.length) + "</p>";
				}
            }

            $("#feedbackHeader").html(fbTxt);
			$("#questionAudio").empty();

            $("#optionHolder").addClass("hidden"); // hide with class rather than .hide() as otherwise the display: flex css (added when div has answerBtn class) gets added as inline style when shown & therefore stays there even when answerBtn class is removed
			$("#nextBtn, #checkBtn").button("disable");
			if (x_multipleAttemptsAllowed()) {
				// allow a new attempt
                $("#restartBtn").button("enable");
            }
            $("#qTxt").html("");
        };

		this.loadVideo = function() {
			const $video = $("#pageVideo");
			$video.empty();
			let videoDimensions = $video.data("dimensions");
			const padding = $video.parent("#vidHolder").outerWidth(true) - $video.parent("#vidHolder").width();
			$video.hide(); // temporarily hide in case it's making text column too wide
			const maxW = $("#textHolder").width() - padding;
			$video.show();
			
			if (maxW < videoDimensions[0]) {
				const scale = maxW / videoDimensions[0];
				videoDimensions = [videoDimensions[0] * scale, videoDimensions[1] * scale];
			}

			$video.mediaPlayer({
				type: "video",
				source: $video.data("src"),
				width: Number(videoDimensions[0]),
				height: Number(videoDimensions[1])
			});
		}

		this.init = function() {
			const $textHolder = $("#textHolder");

			$textHolder.html(x_addLineBreaks(x_currentPageXML.getAttribute("instructions")));

			if (x_currentPageXML.getAttribute("video") != undefined && x_currentPageXML.getAttribute("video") != "") {
				$textHolder.append('<div id="vidHolder" class="panel inline"><div id="pageVideo"></div></div>');
				var $pageVideo = $("#pageVideo"),
						videoDimensions = [640,480]; // default video size
				if (x_currentPageXML.getAttribute("movieSize") != "" && x_currentPageXML.getAttribute("movieSize") != undefined) {
					var dimensions = x_currentPageXML.getAttribute("movieSize").split(",");
					if (dimensions[0] != 0 && dimensions[1] != 0) {
						videoDimensions = dimensions;
					}
				}
				$pageVideo.data({
					"src"			:x_currentPageXML.getAttribute("video"),
					"dimensions"	:videoDimensions
				});
				quiz.loadVideo();
			}

			if (x_currentPageXML.getAttribute("img") != undefined && x_currentPageXML.getAttribute("img") != "") {
				var imgString = '';
				if (x_currentPageXML.getAttribute("caption") != undefined && x_currentPageXML.getAttribute("caption") != "") {
					imgString += '<figure>';
				}
				imgString += '<img class="quizImg" src="' + x_evalURL(x_currentPageXML.getAttribute("img")) + '"';
				if (x_currentPageXML.getAttribute("tip") != undefined && x_currentPageXML.getAttribute("tip") != "") {
					imgString += ' alt="' + x_currentPageXML.getAttribute("tip") + '"';
				}
				imgString += '>';
				if (x_currentPageXML.getAttribute("caption") != undefined && x_currentPageXML.getAttribute("caption") != "") {
					imgString += '<figcaption>' + x_currentPageXML.getAttribute("caption") + '</figcaption></figure>';
				}
				$textHolder.append(imgString);
			}

			// panel position data is reversed as the property used to be called 'Align text' rather than 'Panel position'
			// send amended data to split screen function as otherwise layout will be reversed
			const attributes = {
				panelPosition: x_currentPageXML.getAttribute("align") !== "right" ? "right" : "left",
				pageTxt: $("#textHolder").html().trim() // this will be empty or will contain instructions &/or video &/or image
			}
			// set up split screen layout
			XENITH.SPLITSCREEN.init({"attributes": attributes});

			// submitBtnWidth/nextBtnWidth/restartBtnWidth attributes not used as buttons will be sized automatically, submitBtnTip/nextBtnTip/restartBtnTip attributes also not used
			// if language attributes aren't in xml will have to use english fall back
			var submitBtnText = x_currentPageXML.getAttribute("submitBtnText");
			if (submitBtnText == undefined) {
				submitBtnText = "Submit";
			}
			var nextBtnText = x_currentPageXML.getAttribute("nextBtnText");
			if (nextBtnText == undefined) {
				nextBtnText = "Next";
			}
			var restartBtnText = x_currentPageXML.getAttribute("restartBtnText");
			if (restartBtnText == undefined) {
				restartBtnText = "Restart";
			}
			var singleRight = x_currentPageXML.getAttribute("singleRight");
			if (singleRight == undefined) {
				singleRight = "Your answer is correct";
			}
			var singleWrong = x_currentPageXML.getAttribute("singleWrong");
			if (singleWrong == undefined) {
				singleWrong = "Your answer is incorrect";
			}
			var multiRight = x_currentPageXML.getAttribute("multiRight");
			if (multiRight == undefined) {
				multiRight = "You have selected all the correct answers";
			}
			var multiWrong = x_currentPageXML.getAttribute("multiWrong");
			if (multiWrong == undefined) {
				multiWrong = "You have not selected the correct combination of answers";
			}
			var onCompletionText = x_currentPageXML.getAttribute("onCompletion");
			if (onCompletionText == undefined) {
				onCompletionText = "You have completed the exercise";
			}
			var scoreText = x_currentPageXML.getAttribute("score");
			if (scoreText == undefined) {
				scoreText = "You scored {i} / {n}";
			}
            var feedbackLabel = x_currentPageXML.getAttribute("feedbackLabel");
            if (feedbackLabel == undefined) {
                feedbackLabel = "Feedback";
            }

            $("#pageContents").data({
				"feedbackLabel"			:feedbackLabel,
				"singleRight"			:singleRight,
				"singleWrong"			:singleWrong,
				"multiRight"			:multiRight,
				"multiWrong"			:multiWrong,
				"onCompletionText"		:onCompletionText,
				"scoreText"				:scoreText
			});

			$("#checkBtn")
				.button({
					label: submitBtnText
					})
				.click(function() {
					    quiz.showFeedBackandTrackResults();
                        quiz.checked = true;
                    });

			$("#nextBtn")
				.button({
					label: nextBtnText
					})
				.click(function() {
					$(this).button("disable");
					$("#feedbackGroup").find('.feedbackBlock').html("");
					$(".correctFeedback, .incorrectFeedback").removeClass("correctFeedback incorrectFeedback");

					quiz.nextQuestion();

					x_pageContentsUpdated();
					});

			if (x_multipleAttemptsAllowed()) {
				$("#restartBtn")
						.button({
							label: restartBtnText
						})
						.click(function () {
							quiz.startQs();
						});
			} else {
				$("#restartBtn").remove();
			}

			// remove qNoTxt if no string to put in it
			if (x_currentPageXML.getAttribute("quesCount") === "") {
				$("#qNo").remove();
			}

			this.startQs();
			this.sizeChanged();
			x_pageLoaded();
		}

		this.loadAudio = function($audio, soundFile, transcript) {
			$audio.empty();
			if (soundFile != undefined && soundFile != "") {
				$audio.mediaPlayer({
					type	:"audio",
					source	:soundFile,
					width	:"100%"
				});

				$audio.show();
				
				// manually add a transcript button to the end of the audio bar
				if (transcript != false) {
					x_addAudioTranscript($audio, transcript);
				}
			} else {
				$audio.hide();
			}
		}		
	}

	quiz.init();

</script>


<div id="pageContents">

	<div id="textHolder" class="splitScreen_A"></div>

	<div id="infoHolder" class="splitScreen_B">

		<div id="mainPanel" class="panelContent panel" tabindex="0">

			<fieldset class="noStyle">

				<p id="qNo" aria-live="polite"></p>

				<span><legend id="qTxt"></legend></span>

				<div id="questionAudio"></div>
				<div id="optionHolder"></div>

				<div id="buttonHolder">
					<button id="checkBtn"></button>
					<button id="nextBtn"></button>
					<button id="restartBtn"></button>
				</div>

				<div id="feedbackGroup" aria-live="polite">
					<div id="feedbackHeader" class="feedbackBlock"></div>
					<div id="topFeedback" class="feedbackBlock"></div>
					<div id="middleFeedback" class="feedbackBlock"></div>
					<div id="bottomFeedback" class="feedbackBlock"></div>
				</div>

			</fieldset>

		</div>

	</div>

</div>
