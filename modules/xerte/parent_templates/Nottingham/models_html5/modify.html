/* TODO **
- no require answer option - submit without edit is scored as 100%
- multiple attempts always allowed
 */

	// pageChanged & sizeChanged functions are needed in every model file
	// other functions for model should also be in here to avoid conflicts
	var modify = new function() {
		// function called every time the page is viewed after it has initially loaded
		this.pageChanged = function() {
		}

		// function called every time the size of the LO is changed
		this.sizeChanged = function() {
			// panel will be fixed height (100% of available height) if panel style is on, unless there is text above &/or below the panel
			const panelH = XENITH.SPLITSCREEN.resizePanel();

			// this will be used later when showing feedback - it is done differently depending on whether content is centred vertically on the page & whether panel is full height
			$("#pageContents").data("slideIn", x_checkVerticalCentre() && panelH === false);
		}

		this.init = function() {
			const answerHeaderTxt = x_currentPageXML.getAttribute("answerHeaderTxt") == undefined ? "Write your answer here:" : x_currentPageXML.getAttribute("answerHeaderTxt");
			const feedbackBtnTxt = x_currentPageXML.getAttribute("feedbackBtnTxt") == undefined ? "Submit" : x_currentPageXML.getAttribute("feedbackBtnTxt");

			// as there is no correct answer, the score weight will always be zero unless the project level 'scoreTasks' is set to 'all' (by default non-judged tasks do not contribute to the score)
			const weighting = x_calculateWeight(x_currentPageXML.getAttribute("trackingWeight"), false);
			XTSetPageType(x_currentPage, 'numeric', 1, weighting);

			$("#textHolder").html(x_addLineBreaks(x_currentPageXML.getAttribute("pageTxt")));

			// send amended data to split screen function as we need to have backwards compatibility for older projects where defaults were different
			const attributes = {
				panelWidth: x_currentPageXML.getAttribute("panelWidth") == undefined ? "Full" : x_currentPageXML.getAttribute("panelWidth"),
				panelStyle: x_currentPageXML.getAttribute("panelStyle") == undefined ? "true" : x_currentPageXML.getAttribute("panelStyle"),
				removeTxt: x_currentPageXML.getAttribute("removeTxt") == undefined ? "true" : x_currentPageXML.getAttribute("removeTxt"),
				pageTxt: x_currentPageXML.getAttribute("pageTxt")
			}
			// set up split screen layout
			XENITH.SPLITSCREEN.init({"attributes": attributes});

			if (x_currentPageXML.getAttribute("answer") != undefined && x_currentPageXML.getAttribute("answer") != "") {
				const feedbackFieldLabel = x_currentPageXML.getAttribute("feedbackLabel") != undefined ? x_currentPageXML.getAttribute("feedbackLabel") : "Feedback";
				if (x_currentPageXML.getAttribute("answerType") == "false") {
					var $modelTxt = $('<div id="modelTxt" aria-label="' + feedbackFieldLabel + '" aria-live="polite"></div>').insertBefore($('#button'));
					$modelTxt.html(x_currentPageXML.getAttribute("answer"));
				} else {
					var $modelTxt = $('<textarea id="modelTxt" rows="5" readonly aria-label="' + feedbackFieldLabel + '" aria-live="polite"></textarea>').insertBefore($('#button'));
					$modelTxt.html($("<div>").html(x_currentPageXML.getAttribute("answer")).text());
				}
			}

			var modelAnswerTxt = "";
			if (x_currentPageXML.getAttribute("answer") != null && x_currentPageXML.getAttribute("answer") != "") {
				modelAnswerTxt = x_currentPageXML.getAttribute("answer");
			}

			const label = x_currentPageXML.getAttribute("trackinglabel") != null && x_currentPageXML.getAttribute("trackinglabel") != "" ? x_currentPageXML.getAttribute("trackinglabel") : $('<div>').html(x_currentPageXML.getAttribute('name')).text();

            XTEnterInteraction(x_currentPage, 0, 'text', label, [], modelAnswerTxt, [], x_currentPageXML.getAttribute("grouping"));
			
			$("#instruction").html(x_addLineBreaks(x_currentPageXML.getAttribute("instruction")));
			
			if (x_currentPageXML.getAttribute("text") == '') {
				$("#initText").remove();
			} else {
				$("#initText").html($("<div>").html(x_currentPageXML.getAttribute("text")).text());

				const startLabel = x_currentPageXML.getAttribute("startLabel") != undefined ? x_currentPageXML.getAttribute("startLabel") : "Start text";
				$("#initText").attr("aria-label", startLabel);
			}
			
			if (x_currentPageXML.getAttribute("feedback") != undefined && x_currentPageXML.getAttribute("feedback") != '') {
				$('<div id="feedbackTxt">' + x_currentPageXML.getAttribute("feedback") + '</div>').insertBefore($("#button"));
				$('#feedbackTxt').hide();
			}
			
			$("#answer").html('<p>' + answerHeaderTxt + '</p>');

			const answerFieldLabel = x_currentPageXML.getAttribute("answerFieldLabel") != undefined ? x_currentPageXML.getAttribute("answerFieldLabel") : "Answer";

			$("#answerTxt")
				.html($("<div>").html(x_currentPageXML.getAttribute("prompt")).text())
				.attr("aria-label", answerFieldLabel)
				.on('input', function() {
					$("#button").button("enable");

					// to avoid a sudden jump in layout, feedback should slide back up gradually if content is centred vertically & panel is full height
					if ($("#pageContents").data("slideIn")) {
						$("#modelTxt, #feedbackTxt").slideUp();
					} else {
						$("#modelTxt, #feedbackTxt").hide();
					}
				});

			$("#modelTxt").hide();

			$("#button")
				.button({ label: feedbackBtnTxt })
				.click(function() {
					$(this).button("disable");

					// to avoid a sudden jump in layout, feedback should slide in gradually if content is centred vertically & panel is full height
					if ($("#pageContents").data("slideIn")) {
						$("#modelTxt, #feedbackTxt").slideDown();
					} else {
						$("#modelTxt, #feedbackTxt").show();
					}
					
					var answerTxt = $("#answerTxt").val();
					const result =
						{
							success: (answerTxt.trim() == "" ? false : true),
							score: (answerTxt.trim() == "" ? 0.0 : 100.0),
							judge: false
						};

					XTExitInteraction(x_currentPage, 0, result, [], answerTxt, []);
					XTSetPageScore(x_currentPage, (answerTxt.trim() == "" ? 0.0 : 100.0));
				});

			this.sizeChanged();
			x_pageLoaded();
		}
	}

	modify.init();

</script>


<div id="pageContents">

	<div id="textHolder" class="splitScreen_A"></div>

	<div id="infoHolder" class="splitScreen_B">
		<div id="panel" class="panelContent panel">
			<div id="instruction"></div>
			<textarea id="initText" rows="5" readonly></textarea>
			<div id="answer"></div>
			<textarea id="answerTxt" rows="5"></textarea>
			<button id="button"></button>
		</div>
	</div>

</div>
