/* ** TODO: different ways state data should be looked at:
		1: SCORM
		2: xAPI
		3: Standalone pages in lightbox (DONE)
		4: Refresh page (WIP)
*/
 
	// pageChanged & sizeChanged functions are needed in every model file
	// other functions for model should also be in here to avoid conflicts
	var mcq = new function() {
		// the info needed to regenerate a previous state of this page
		this.generateModelState = function () {
			return {
				judge: null, // is there a correct answer for this question?
				optionElements: null, // info about the answer options
				checked: null, // has an answer been submitted? if yes, which answers?
			};
		}

		// function called every time the page is viewed after it has initially loaded
		this.pageChanged = function() {
			x_currentPageState = x_getPageState("state");
		}

		// function called every time the size of the LO is changed
		this.sizeChanged = function() {
			// panel will be fixed height (100% of available height) if panel style is on, unless there is text above &/or below the panel
			const panelH = XENITH.SPLITSCREEN.resizePanel();

			// this will be used later when showing feedback - it is done differently depending on whether content is centred vertically on the page & whether panel is full height
			$("#pageContents").data("slideIn", x_checkVerticalCentre() && panelH === false);

			// ensure any audio players are shown at an appropriate size
			if ($("#pageContents .audioHolder").length > 0) {
				let audioBarW = 0;
				$("#pageContents .audioHolder:eq(0) .mejs-inner .mejs-controls").children().each(function() {
					audioBarW += $(this).outerWidth();
				});
				if (audioBarW - $("#pageContents .audioHolder").parents("#mainPanel").width() < -2 || audioBarW - $("#pageContents .audioHolder").parents("#mainPanel").width() > 2) {
					$x_window.resize();
				}
			}
		}

        this.startQ = function(newAttempt) {
			const correctOptions = [],
					correctAnswer = [],
					correctFeedback = [];

			let judge = false; // is there a correct answer for the question?

            // Track the quiz page
            for (let i=0; i<x_currentPageState.optionElements.length; i++) {
				let answerTxt;
				if (x_currentPageState.optionElements[i].label != undefined) {
					answerTxt = x_currentPageState.optionElements[i].label;
				} else {
					// Create fallback label
					answerTxt = (x_currentPageXML.getAttribute('answerTxt') != undefined ? x_currentPageXML.getAttribute('answerTxt') : "Option");
					answerTxt += ' ' + (i+1);
					answerTxt = x_GetTrackingTextFromHTML(x_currentPageState.optionElements[i].text, answerTxt);
				}

				correctOptions.push({
					id: (i+1)+"",
					answer: answerTxt,
					result: x_currentPageState.optionElements[i].correct === 'true'
				});
				if (x_currentPageState.optionElements[i].correct === 'true') {
					judge = true;
                    correctAnswer.push(answerTxt);
                }
				correctFeedback.push(x_GetTrackingTextFromHTML(x_currentPageState.optionElements[i].feedback, ""));
            }

			if (newAttempt) {
				if(x_currentPageXML.getAttribute("markFeedback") != undefined && x_currentPageXML.getAttribute("markFeedback") == 'false'){
					judge = false;
				}

				x_currentPageState.judge = judge;
			}
			
            // Create fallback label
            this.weighting = 1.0;
            if (x_currentPageXML.getAttribute("trackingWeight") != undefined)
            {
                this.weighting = x_currentPageXML.getAttribute("trackingWeight");
            }

            XTSetPageType(x_currentPage, 'numeric', 1, this.weighting);

            let label = (x_currentPageXML.getAttribute('name') != undefined ? x_currentPageXML.getAttribute('name') : "Multiple choice question");
            label += ' ' + (x_currentPage+1);
			if (x_currentPageXML.getAttribute("trackinglabel") != null && x_currentPageXML.getAttribute("trackinglabel") != "")
			{
				label = x_currentPageXML.getAttribute("trackinglabel");
			}
			else
			{
				label = x_GetTrackingTextFromHTML(x_currentPageXML.getAttribute("prompt"), label);
			}
            XTEnterInteraction(x_currentPage, 0, 'multiplechoice', label, correctOptions, correctAnswer, correctFeedback, x_currentPageXML.getAttribute("grouping"));

			if (!newAttempt && x_currentPageState.checked !== false) {
				// an attempt was made in a previous session - reinstate this now
				for (let i=0; i<x_currentPageState.checked.length; i++) {
					$("#option" + x_currentPageState.checked[i]).prop("checked", true);
				}
				mcq.answerSelected($("#optionHolder").hasClass("answerBtn") ? $("#option" + x_currentPageState.checked[0]) : null, false);
			}
        }

        this.leavePage = function() {
			// no answers have been submitted but a selection has been made
			// auto submit answer on leaving the page
			if ($(x_currentPageXML).children().length > 0 && x_currentPageState.checked === false && $("#optionHolder input:checked").length > 0) {
				this.showFeedBackandTrackScore(true);
			}
        }

        this.showFeedBackandTrackScore = function(newAttempt) {
            let answerFeedback = "",
					genFeedback,
					correct = (x_currentPageXML.getAttribute("type") == "Multiple Answer"),
					answered = false;

			const l_options = [],
					l_answers = [],
					l_feedbacks = [],
					checked = [],
					selected = $("#optionHolder input");
			
            if (x_currentPageXML.getAttribute("feedback") != undefined && x_currentPageXML.getAttribute("feedback") != '') {
				genFeedback = x_addLineBreaks(x_currentPageXML.getAttribute("feedback"));
				if (genFeedback != "" && genFeedback.indexOf('<p') == -1) {
					genFeedback = '<p>' + genFeedback + '</p>';
				}
            }

            for (let i=0; i<selected.length; i++) {
                const optionIndex = $(selected[i]).parents(".answerBtn").length > 0 ? $(selected[i]).parents(".answerBtn").index() : $(selected[i]).parent().index(),
						selectedOption = x_currentPageState.optionElements[optionIndex];

				let currCorrect;

				if (x_currentPageXML.getAttribute("type") == "Multiple Answer") {
					currCorrect = (
						(selectedOption.correct == "true" && $(selected[i]).is(':checked')) ||
						(selectedOption.correct == "false" && !$(selected[i]).is(':checked'))
					);
					correct = correct && currCorrect;
				}
				else {
					currCorrect = selectedOption.correct == "true" && $(selected[i]).is(':checked');
					correct = correct || currCorrect;
                }

                if ($(selected[i]).is(':checked')) {
					answered = true;
					let tempFeedback = "";
					tempFeedback += selectedOption.feedback;
					if (tempFeedback != "" && tempFeedback.indexOf('<p') == -1) {
						tempFeedback = '<p>' + tempFeedback + '</p>';
					}
					if (selectedOption.audioFB != undefined && selectedOption.audioFB != "") {
						tempFeedback += '<div class="audioHolder" data-audio="' + selectedOption.audioFB + '" data-transcript="' + selectedOption.transcript + '"></div>';
					}
					if (tempFeedback != "") {
						if (x_currentPageState.judge) {
							tempFeedback = '<div class="' + (currCorrect ? 'correct' : 'incorrect') + 'Feedback">' + tempFeedback + '</div>';
						}
						answerFeedback += tempFeedback;
					}

					let answerTxt = "";
					if (selectedOption.label != undefined) {
						answerTxt = selectedOption.label;
					} else {
						// Create fallback label
						answerTxt = (x_currentPageXML.getAttribute('answerTxt') != undefined ? x_currentPageXML.getAttribute('answerTxt') : "Option");
						answerTxt += ' ' + (optionIndex + 1);
						answerTxt = x_GetTrackingTextFromHTML(selectedOption.text, answerTxt);
					}

					if (newAttempt) {
						checked.push(optionIndex);
						l_options.push({
							id: optionIndex + 1 + "",
							answer: answerTxt,
							result: currCorrect
						});
						l_answers.push(answerTxt);
						l_feedbacks.push(x_GetTrackingTextFromHTML(selectedOption.feedback, ""));
					}
                }
            }

			if (answered) {
				function feedback() {
					const singleRight = x_currentPageXML.getAttribute("singleRight") != undefined ? x_currentPageXML.getAttribute("singleRight") : "Your answer is correct",
							singleWrong = x_currentPageXML.getAttribute("singleWrong") != undefined ? x_currentPageXML.getAttribute("singleWrong") : "Your answer is incorrect",
							multiRight = x_currentPageXML.getAttribute("multiRight") != undefined ? x_currentPageXML.getAttribute("multiRight") : "You have selected all the correct answers",
							multiWrong = x_currentPageXML.getAttribute("multiWrong") != undefined ? x_currentPageXML.getAttribute("multiWrong") : "You have not selected the correct combination of answers";

					let rightWrongTxt = "";

					// add correct feedback depending on if question overall has been answered correctly or not
					if (x_currentPageXML.getAttribute("markFeedback") != 'false') { // new optional property allows for this feedback to be turned off
						if (x_currentPageXML.getAttribute("type") == "Multiple Answer") {
							if (x_currentPageState.judge == true) { // there is a correct answer for question
								if (correct == true) {
									$("#feedback").addClass("correctFeedback");
									rightWrongTxt = multiRight != '' ? '<div class="correctFeedback"><p>' + multiRight + '</p></div>' : '';
								} else {
									$("#feedback").addClass("incorrectFeedback");
									rightWrongTxt = multiWrong != '' ? '<div class="incorrectFeedback"><p>' + multiWrong + '</p></div>' : '';
								}
							}
						} else {
							if (x_currentPageState.judge == true) { // there is a correct answer for question
								if (correct == true) {
									$("#feedback").addClass("correctFeedback");
									rightWrongTxt = singleRight != '' ? '<div class="correctFeedback"><p>' + singleRight + '</p></div>' : '';
								} else {
									$("#feedback").addClass("incorrectFeedback");
									rightWrongTxt = singleWrong != '' ? '<div class="incorrectFeedback"><p>' + singleWrong + '</p></div>' : '';
								}
							}
						}
					}

					let feedback = 0;
					const feedbackDiv = ['top', 'middle', 'bottom'];

					// order feedback is shown - default is: general feedback > answer feedback > correct/incorrect feedback
					let feedbackOrder = x_currentPageXML.getAttribute("feedbackPos") == undefined ? 'GAC' : x_currentPageXML.getAttribute("feedbackPos");
					feedbackOrder = [...feedbackOrder];

					if (answerFeedback != undefined && answerFeedback != '') {
						feedback++;
					} else {
						feedbackOrder.splice(feedbackOrder.indexOf('A'), 1);
					}
					if (genFeedback != undefined && genFeedback != '') {
						feedback++;
					} else {
						feedbackOrder.splice(feedbackOrder.indexOf('G'), 1);
					}
					if (rightWrongTxt != undefined && rightWrongTxt != '') {
						feedback++;
					} else {
						feedbackOrder.splice(feedbackOrder.indexOf('C'), 1);
					}

					// show the feedback in the order specified
					// feedback will include correctFeedback / incorrectFeedback classes that can be used in themes to style feedback differently
					for (let i=0; i<feedbackDiv.length; i++) {
						if (i < feedback) {
							let thisFeedback;
							if (feedbackOrder[i] == 'G') {
								thisFeedback = genFeedback;
							} else if (feedbackOrder[i] == 'A') {
								thisFeedback = answerFeedback;
							} else {
								thisFeedback = rightWrongTxt;
							}

							$('#' + feedbackDiv[i] + 'Feedback')
									.html(thisFeedback)
									.show();

						} else {
							$('#' + feedbackDiv[i] + 'Feedback')
									.html('')
									.hide();
						}
					}

					const feedbackLabel = x_currentPageXML.getAttribute("feedbackLabel") == undefined ? "Feedback" : x_currentPageXML.getAttribute("feedbackLabel");
					$("#feedbackHeader").html(feedbackLabel != '' ? "<h3>" + feedbackLabel + "</h3>" : '');

					$("#feedback")
							.hide()
							.find(".audioHolder").each(function () {
						$(this).mediaPlayer({
							type: "audio",
							source: $(this).data("audio"),
							width: "100%"
						});

						// manually add a transcript button to the end of the audio bar
						if ($(this).data("transcript") !== false) {
							x_addAudioTranscript($("#feedback").find(".audioHolder"), $(this).data("transcript"));
						}
					});

					// to avoid a sudden jump in layout, feedback should slide in gradually if content is centred vertically & panel is full height
					if ($("#pageContents").data("slideIn") && newAttempt) {
						$("#feedback").slideDown(function () {
							// refresh feedback so it is picked up by screen readers now not hidden
							$("#feedback .feedbackBlock").each(function () {
								$(this).html($(this).html());
							});
						});

					} else {
						$("#feedback").show();
						$("#checkBtn").hide();

						// refresh feedback so it is picked up by screen readers now not hidden
						setTimeout(() => {
							$("#feedback .feedbackBlock").each(function () {
								$(this).html($(this).html());
							});
						}, 0);
					}
					$("#checkBtn").button("disable");

					// scroll to the feedback div so there is less chance of feedback being completely off-screen
					$("#mainPanel").animate({
						scrollTop: $("#mainPanel").scrollTop() - $("#mainPanel").offset().top + $("#feedback").offset().top
					}, 500);

					const result = {
						success: correct || !x_currentPageState.judge,
						score: correct ? 100.0 : 0.0,
						judge: x_currentPageState.judge
					};

					if (newAttempt) {
						x_currentPageState.checked = checked;
						XTExitInteraction(x_currentPage, 0, result, l_options, l_answers, l_feedbacks, x_currentPageXML.getAttribute("trackinglabel"));
						XTSetPageScore(x_currentPage, (correct || !x_currentPageState.judge ? 100.0 : 0.0), x_currentPageXML.getAttribute("trackinglabel"));
					}

					if (XTGetMode() == "normal") {
						// Disable all options
						for (let i=0; i<$(".optionGroup").length; i++) {
							$("#option" + i).attr("disabled", "disabled");
						}
					}

					x_pageContentsUpdated();
				}

				// check no feedback is currently shown & slide up if it is (this will only happen if mcq type is button as normally slide up happens when option chosen changes before submitting)
				if ($("#feedback").is(":visible") && $("#pageContents").data("slideIn")) {
					$("#feedback").slideUp(function () {
						$("#feedback").find('.feedbackBlock').html("");
						feedback();
					});
				} else {
					feedback();
				}
			}
        }

		this.init = function() {
			// reload a saved state if it already exists, otherwise create a fresh state ready for data to be added on page setup
			x_currentPageState = x_createPageState("state");

			// is this a brand new attempt at this activity - no previous state loaded?
			// some setup won't need to be done if state data has been loaded
			const newAttempt = x_currentPageState.reinstate !== true;
			console.log(x_currentPageState);
			console.log("new attempt: " + newAttempt);

			$("#textHolder").html(x_addLineBreaks(x_currentPageXML.getAttribute("instruction")));

			// panel position data is reversed as the property used to be called 'Align text' rather than 'Panel position'
			// send amended data to split screen function as otherwise layout will be reversed
			const attributes = {
				panelPosition: x_currentPageXML.getAttribute("align") !== "Right" ? "Right" : "Left",
				pageTxt: x_currentPageXML.getAttribute("instruction")  // xml property is instruction not text that is used in most page models
			}
			// set up split screen layout
			XENITH.SPLITSCREEN.init({"attributes": attributes});

			$("#feedback").hide();
			$("#question").html(x_addLineBreaks(x_currentPageXML.getAttribute("prompt")));
			
			const $optionHolder = $("#optionHolder").append('<div class="optionGroup"></div>');
			
			if ($(x_currentPageXML).children().length == 0) {
				$("#optionHolder").html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noA", "No answer options have been added") + '</span>');
				$("#checkBtn").remove();
			} else {
				if (x_currentPageXML.getAttribute("type") == "Multiple Answer") {
					$optionHolder.find(".optionGroup").append('<input type="checkbox" name="option" /><label class="optionTxt"></label>');
				} else if (x_currentPageXML.getAttribute("answerType") == "button") {
					$optionHolder.addClass("answerBtn")
							.find(".optionGroup").addClass("answerBtn")
							.append('<input type="checkbox" name="option" /><label class="optionTxt"></label>');
					$("#checkBtn").remove();
				} else {
					$optionHolder.find(".optionGroup").append('<input type="radio" name="option" /><label class="optionTxt"></label>');
				}

				const $optionGroup = $optionHolder.find(".optionGroup");

				// store info about this question
				if (newAttempt) {
					const elements = []
					$(x_currentPageXML).children().each(function (i) {
						elements.push(
								{
									label: this.getAttribute("name"),
									text: this.getAttribute("text"),
									correct: this.getAttribute("correct"),
									feedback: this.getAttribute("feedback"),
									audioFB: this.getAttribute("audioFB"),
									transcript: this.getAttribute("audioTranscript") != undefined && this.getAttribute("audioTranscript") != '' ? this.getAttribute("audioTranscript") : false
								}
						);
					});

					// ** try to minimise the state data being stored? just store the index of options in the order they are displayed?
					x_currentPageState.optionElements = elements;

					// Randomise the answers, if required
					if (x_currentPageXML.getAttribute("answerOrder") == 'random') {
						for (let tmp, j, k, i = x_currentPageState.optionElements.length; i--;) {
							j = Math.floor(Math.random() * x_currentPageState.optionElements.length);
							k = Math.floor(Math.random() * x_currentPageState.optionElements.length);
							tmp = x_currentPageState.optionElements[j];
							x_currentPageState.optionElements[j] = x_currentPageState.optionElements[k];
							x_currentPageState.optionElements[k] = tmp;
						}
					}

					x_currentPageState.checked = false;
				}

				$.each(x_currentPageState.optionElements, function(i, thisOption) {
						let $thisOptionGroup,
								$thisOption,
								$thisOptionTxt;

						if (i != 0) {
							$thisOptionGroup = $optionGroup.clone().appendTo($optionHolder);
						} else {
							$thisOptionGroup = $optionGroup;
						}

						if ($thisOptionGroup.hasClass("answerBtn")) {
							$thisOptionGroup.button();
						}

						$thisOption = $thisOptionGroup.find("input");
						$thisOptionTxt = $thisOptionGroup.find(".optionTxt");

						$thisOption
								.attr({
									"value"		:thisOption.text,
									"id"		:"option" + i
								})
								.change(function() {
									// to avoid a sudden jump in layout, feedback should slide up gradually if content is centred vertically & panel is full height
									if ($("#pageContents").data("slideIn")) {
										if ($("#feedback").is(":visible")) {
											$("#feedback").slideUp(function () {
												$("#feedback").find('.feedbackBlock').html("");
											});
										}
									} else {
										$("#feedback").hide().find('.feedbackBlock').html("");
									}
									$(".correctFeedback, .incorrectFeedback").removeClass("correctFeedback incorrectFeedback");

									mcq.answerSelected($(this), true);
								});

						if (x_currentPageXML.getAttribute("type") == "Multiple Answer" || x_currentPageXML.getAttribute("answerType") !== "button") {
							$thisOption
								.focusin(function () {
									$thisOptionGroup.addClass("highlight");
								})
								.focusout(function () {
									$thisOptionGroup.removeClass("highlight");
								});
						} else {
							$thisOption
									.focusin(function () {
										$thisOptionGroup.addClass("ui-state-focus");
									})
									.focusout(function () {
										$thisOptionGroup.removeClass("ui-state-focus");
									});
						}

						$thisOptionTxt
								.attr("for", "option" + i)
								.data("option", $thisOption)
								.html(thisOption.text);
					});

				// check button is not shown if answer type is button
				if ($("#checkBtn").length > 0) {
					$("#checkBtn")
							.button({
								label: x_currentPageXML.getAttribute("checkBtnTxt") != undefined ? x_currentPageXML.getAttribute("checkBtnTxt") : "Check",
								disabled: true
							})
							.click(function () {
								mcq.showFeedBackandTrackScore(true);
							})
				}

				this.startQ(newAttempt);
			}
			
			this.sizeChanged();
			x_pageLoaded();
		}

		this.answerSelected = function($this, newAttempt) {
			const $checkBtn = $("#checkBtn"),
					$selected = $("#optionHolder input:checked");

			if (!$("#optionHolder").hasClass("answerBtn")) {
				// radio button / checkbox
				$checkBtn.show();
				if ($selected.length == 0) {
					$checkBtn.button("disable");
				} else if ($selected.length > 0) {
					$checkBtn.button("enable");
					if (!newAttempt) {
						// reinstate feedback etc. but without tracking attempt again
						mcq.showFeedBackandTrackScore(newAttempt);
					}
				}

			} else if ($selected.length > 0) {
				// toggle button
				if ($selected.length > 1) {
					$selected.not($this)
							.prop("checked", false)
							.parents(".answerBtn").removeClass("selected");
				}
				$this.parents(".answerBtn").addClass("selected");
				mcq.showFeedBackandTrackScore(newAttempt);
			} else if ($(".answerBtn.selected").length > 0) {
				$(".answerBtn.selected").removeClass("selected");
			}
		}
	}

	mcq.init();

</script>


<div id="pageContents">

	<div id="textHolder" class="splitScreen_A"></div>

	<div id="infoHolder" class="splitScreen_B">
		<div id="mainPanel" class="panelContent panel" tabindex="0">
			<fieldset class="noStyle">
				<legend id="question"></legend>
				<div id="optionHolder"></div>
				<button id="checkBtn"></button>
				<div id="feedback" aria-live="polite">
					<div id="feedbackHeader" class="feedbackBlock"></div>
					<div id="topFeedback" class="feedbackBlock"></div>
					<div id="middleFeedback" class="feedbackBlock"></div>
					<div id="bottomFeedback" class="feedbackBlock"></div>
				</div>
			</fieldset>
		</div>
	</div>

</div>
