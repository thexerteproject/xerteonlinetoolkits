/* TODO **
- attempts before hint clash with new single / multiple attempt?
- no restart option when multiple attempts are allowed
- no require answer option - submit without answer (when judge is off) is scored as 100%
- add feedback option to show when fully complete
 */

	// pageChanged & sizeChanged functions are needed in every model file
	// other functions for model should also be in here to avoid conflicts
	var dialog = new function() {
		// function called every time the page is viewed after it has initially loaded
		this.pageChanged = function() {
		}

		// function called every time the size of the LO is changed
		this.sizeChanged = function() {
			// panel will be fixed height (100% of available height) if panel style is on, unless there is text above &/or below the panel
			const panelH = XENITH.SPLITSCREEN.resizePanel();

			// this will be used later when showing feedback - it is done differently depending on whether content is centred vertically on the page & whether panel is full height
			$("#pageContents").data("slideIn", x_checkVerticalCentre() && panelH === false);
		}

		this.init = function() {
			const weighting = x_calculateWeight(x_currentPageXML.getAttribute("trackingWeight"), x_currentPageXML.getAttribute("judge"));

            XTSetPageType(x_currentPage, 'numeric', $(x_currentPageXML).children().length, weighting);

			$("#textHolder").html(x_addLineBreaks(x_currentPageXML.getAttribute("text")));

			// set up split screen layout
			XENITH.SPLITSCREEN.init();

			var answerDelimeter = x_currentPageXML.getAttribute("answerDelimeter");
			if (answerDelimeter == undefined) {
				answerDelimeter = ",";
			}

			// if language attributes aren't in xml will have to use english fall back
			var tryTxt = x_currentPageXML.getAttribute("tryTxt");
			if (tryTxt == undefined) {
				tryTxt = "Try again.";
			}
			var correctTxt = x_currentPageXML.getAttribute("correctTxt");
			if (correctTxt == undefined) {
				correctTxt = "The correct answer is shown.";
			}
			var submitTxt = x_currentPageXML.getAttribute("submitBtnTxt");
			if (submitTxt == undefined) {
				submitTxt = "Submit";
			}
			var nextTxt = x_currentPageXML.getAttribute("nextBtnTxt");
			if (nextTxt == undefined) {
				nextTxt = "Next";
			}

			$("#pageContents").data({
				"currentQ"	:0,
				"correctAnswers": 0,
				"tryTxt"	:tryTxt,
				"correctTxt":correctTxt,
				"submitTxt"	:submitTxt,
				"nextTxt"	:nextTxt,
				"casesensitive": x_currentPageXML.getAttribute("casesensitive") != "true" && x_currentPageXML.getAttribute("casesensitive") != "1" ? false : true
			});

			var $question = $("#pageContents .question:first");
			$question.find(".result")
				.addClass("hidden")
				.parent().find(".tickTxt").html("");

			$(x_currentPageXML).children()
				.each(function(i) {
					var $thisQ;
					if (i != 0) {
						$thisQ = $question.clone().appendTo($question.parent());
						$thisQ.hide();
					} else {
						$thisQ = $question;
						let answers = this.getAttribute("answer").split(answerDelimeter)
						XTEnterInteraction(x_currentPage, 0, 'fill-in', this.getAttribute("question"), answers, answers, null /* never used*/, x_currentPageXML.getAttribute("grouping"));
					}

					$thisQ.find("label")
						.html(x_addLineBreaks(this.getAttribute("question")))
						.attr("for", "answer" + i);

					$thisQ.find("input").attr("id", "answer" + i);
				});

			$("#submitBtn")
				.button({
					label:	submitTxt
					})
				.data({
					"attempt":	0,
					"state":	0,
					"click":	true,
					"pause":	false
					})
				.click(function() {
					const $pageContents = $("#pageContents");
					const qNo = $pageContents.data("currentQ");

					if (qNo + 1 <= $(x_currentPageXML).children().length) {
						var $this = $(this);
						if ($this.data("click") == true) {
							const $feedback = $("#feedback");

							if ($this.data("state") == 0) { // mark answer
								// Decode answer
								var $thisInput = $("#pageContents .question:eq(" + qNo + ") input"),
										isCorrect = false,
										correctAnswer = $('<div/>').html($(x_currentPageXML).children()[qNo].getAttribute("answer")).text();

								if (correctAnswer.indexOf(answerDelimeter) != -1) {
									var splitAnswers = correctAnswer.split(answerDelimeter);
									for (var i = 0; i < splitAnswers.length; i++) {
										if ($("#pageContents").data("casesensitive")) {
											if ($.trim($thisInput.val()) == $.trim(splitAnswers[i])) {
												isCorrect = true;
												break;
											}
										} else {
											if ($.trim($thisInput.val().toLowerCase()) == $.trim(splitAnswers[i]).toLowerCase()) {
												isCorrect = true;
												break;
											}
										}
									}
								} else {
									if ($("#pageContents").data("casesensitive")) {
										if ($.trim($thisInput.val()) == $.trim(correctAnswer)) {
											isCorrect = true;
										}
									} else {
										if ($.trim($thisInput.val().toLowerCase()) == $.trim(correctAnswer).toLowerCase()) {
											isCorrect = true;
										}
									}
								}
								let userAnswer = $thisInput.val();

								// are submitted answers going to be judged against correct answers or is it collecting opinions only?
								const judge = x_checkIfJudged(x_currentPageXML.getAttribute("judge"));

								if (isCorrect == true || !judge) { // correct
									$thisInput
											.val($.trim($thisInput.val()))
											.prop("readonly", true);
									if (judge) {
										$thisInput.parent().find(".result")
												.removeClass("hidden")
												.parent().find(".tickTxt").html(x_getLangInfo(x_languageData.find("tick")[0], "title", "Correct"));
									}

									$feedback.html("");
									$this.focus();
									if (qNo + 1 != $(x_currentPageXML).children().length) {
										$this
												.button({label: $pageContents.data("nextTxt")})
												.data("state", 1);
									} else {
										$("#pageContents input#answer" + qNo).unbind("keypress");
										$pageContents.data("currentQ", qNo + 1);

										if ($("#pageContents").data("slideIn")) {
											$this.button("disable");
											$this.slideUp(200);
										} else {
											$this.hide();
										}
									}
									let result = {
										success: true,
										score: 100,
										judge: judge
									}
									XTExitInteraction(x_currentPage, qNo, result, null/* ignored for fill-in*/, userAnswer, null/*not used*/);
									$pageContents.data("correctAnswers", $pageContents.data("correctAnswers") + 1);
									XTSetPageScore(x_currentPage, 100 * ($pageContents.data("correctAnswers") / $(x_currentPageXML).children().length), qNo + 1 == $(x_currentPageXML).children().length);

									if (!judge) {
										$feedback.html("");

										$("#pageContents input#answer" + qNo).unbind("keypress");
										$pageContents.data("currentQ", qNo + 1);

										if ($("#pageContents").data("slideIn")) {
											$("#pageContents .question:eq(" + (qNo + 1) + ")").slideDown();
										} else {
											$feedback.html("");
											$("#pageContents .question:eq(" + (qNo + 1) + ")").fadeIn();
										}

										$this
												.data({
													"attempt": 0,
													"state": 0
												})
												.button({label: $("#pageContents").data("submitTxt")});

										$("#pageContents .question:eq(" + (qNo + 1) + ") input").focus();

										if ($(x_currentPageXML).children().length > qNo + 1) {
											let question = $(x_currentPageXML).children()[qNo + 1];
											let answers = question.getAttribute("answer").split(answerDelimeter);
											XTEnterInteraction(x_currentPage, qNo + 1, 'fill-in', question.getAttribute("question"), answers, answers, null /* never used*/, x_currentPageXML.getAttribute("grouping"));
										}
										$pageContents.data("currentQ", qNo + 1);
									}
								} else { // incorrect
									$this.data("attempt", $this.data("attempt") + 1);
									var currentAttempt = $this.data("attempt"),
											allowedAttempts = x_currentPageXML.getAttribute("attempts");

									if (allowedAttempts == undefined) {
										allowedAttempts = 0;
									}
									if (currentAttempt == allowedAttempts) { // show hint
										$feedback.html($(x_currentPageXML).children()[qNo].getAttribute("hint"));
									} else if (currentAttempt > allowedAttempts || !judge) { // show correct answer
										$feedback.html($pageContents.data("correctTxt"));
										var correctAnswer = $('<div/>').html($(x_currentPageXML).children()[qNo].getAttribute("answer")).text();
										if (correctAnswer.indexOf(answerDelimeter) != -1) {
											correctAnswer = $.trim(correctAnswer.split(answerDelimeter)[0]);
										}
										$thisInput
												.val(correctAnswer)
												.prop("readonly", true);
										if (qNo + 1 != $(x_currentPageXML).children().length) {
											$this
													.button({label: $pageContents.data("nextTxt")})
													.data("state", 1);
											$feedback.html($feedback.html());

										} else {
											$("#pageContents input#answer" + qNo).unbind("keypress");
											$pageContents.data("currentQ", qNo + 1);

											if ($("#pageContents").data("slideIn")) {
												$this.button("disable");
												$this.slideUp(200);
											} else {
												$this.hide();
											}
										}
										let result = {
											success: false,
											score: 0,
											judge: judge
										};

										XTExitInteraction(x_currentPage, qNo, result, null/* ignored for fill-in*/, userAnswer, null/*not used*/);
										XTSetPageScore(x_currentPage, 100 * ($pageContents.data("correctAnswers") / $(x_currentPageXML).children().length), qNo + 1 == $(x_currentPageXML).children().length);

									} else { // another attempt allowed
										$feedback.html($pageContents.data("tryTxt"));
									}
								}
							} else { // move to next question
								$("#pageContents input#answer" + qNo).unbind("keypress");

								if ($("#pageContents").data("slideIn")) {
									$("#pageContents .question:eq(" + (qNo + 1) + ")").slideDown();
								} else {
									$feedback.html("");
									$("#pageContents .question:eq(" + (qNo + 1) + ")").fadeIn();
								}

								$this
										.data({
											"attempt": 0,
											"state": 0
										})
										.button({label: $("#pageContents").data("submitTxt")});

								$("#pageContents .question:eq(" + (qNo + 1) + ") input").focus();
								let question = $(x_currentPageXML).children()[qNo + 1];
								let answers = question.getAttribute("answer").split(answerDelimeter);
								XTEnterInteraction(x_currentPage, qNo + 1, 'fill-in', question.getAttribute("question"), answers, answers, null /* never used*/, x_currentPageXML.getAttribute("grouping"));
								$pageContents.data("currentQ", qNo + 1);
							}
						}
						// this is needed as if this is triggered via keypress in IE/Opera it's triggered twice so messes up no. attempts
						if ($this.data("pause") == true) {
							$this.data({
								"click": false,
								"pause": false
							});
							setTimeout(function () {
								$this.data("click", true)
							}, 1);
						}
					}
				});

			$("#pageContents input").keypress(function(e) {
				if ((e.keyCode ? e.keyCode : e.which) == 13) { // return key
					if (!$("#submitBtn").is(":disabled") && !$("#submitBtn").is(":hidden")) {
						$("#submitBtn")
								.data({
									"click": true,
									"pause": true
								})
								.trigger("click");
					}
				}
			});
			
			this.sizeChanged();
			x_pageLoaded();
		}
	}

	dialog.init();

</script>


<div id="pageContents">

	<div id="textHolder" class="splitScreen_A"></div>

	<div id="infoHolder" class="splitScreen_B">
		<div class="panelContent panel" tabindex="0">
			<div id="questionGroup">
				<div class="question">
					<label></label>
					<span class="tickTxt ui-helper-hidden-accessible" aria-live="polite"></span><span class="result fa fa-fw fa-x-tick"></span>
					<input/>
				</div>

			</div>
			<button id="submitBtn"></button>
			<p id="feedback" aria-live="polite"></p>
		</div>
	</div>

</div>
