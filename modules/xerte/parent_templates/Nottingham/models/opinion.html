	var opinion = new function() {
		let $pageContents,
			printAvailable = false,
			JSONGraph;

		this.sizeChanged = function() {
			let resized = false;

			// panel will be fixed height (100% of available height) if panel style is on, unless there is text above &/or below the panel
			XENITH.SPLITSCREEN.resizePanel();
			
			$.each($(".questionAudio"), function(key, qA) {
			    const qAudio = $("#" + qA.id);
                if (qAudio.children().length > 0) {
                    if (resized == false) {
                        let audioBarW = 0;
                        qAudio.find(".mejs-inner").find(".mejs-controls").children().each(function() {
                            audioBarW += $(this).outerWidth();
                        });
                        if (audioBarW < qAudio.width() - 5 || audioBarW > qAudio.width() + 5) {
                            resized = true;
                            $x_window.resize();
                        }
                    }
                }
			});

			const audioHolder = $("#pageContents .audioHolder");
			if (audioHolder.length > 0) {
				if (resized == false) {
					let audioBarW = 0;
					$("#pageContents .audioHolder:eq(0) .mejs-inner .mejs-controls").children().each(function() {
						audioBarW += $(this).outerWidth();
					});

					if (audioBarW - audioHolder.parents("#mainPanel").width() < -2 || audioBarW - audioHolder.parents("#mainPanel").width() > 2) {
						resized = true;
						$x_window.resize();
					}
				}
			}

			// ensure radar chart resizes sensibly
			if ($("#diagram").length > 0 && $("#diagram").is(":visible")) {
				$("#canvas-container").css({
					"width": "0px",
					"height": "0px"
				});
				this.setWidths();
				this.createGraphObject();
				this.drawGraph(false);

			} else {
				this.setWidths();
			}
		};

		this.setWidths = function() {
			// try to make best use of the space
			let width = Math.floor($("#mainPanel").innerWidth() - ($("#canvas-container").parent("fieldset").outerWidth() - $("#canvas-container").parent("fieldset").width()) - 20);
			const paddingWidthMainPanel = $("#mainPanel").outerWidth(true) - $("#mainPanel").innerWidth() + parseFloat($("#mainPanel").css('padding-left')) + parseFloat($("#mainPanel").css('padding-right'));
			width -= paddingWidthMainPanel;

			let height;
			if (!$("#mainPanel").hasClass("printing")) {
				if ($("#qNo").height() + $("#feedback").height() + $("#buttonHolder").height() < $("#mainPanel").height() / 3) {
					// if the rest of the content on the panel isn't too tall, try to fit chart in without scrolling
					height = x_getAvailableHeight([$("#mainPanel")], [$("#qNo"), $("#feedback"), $("#buttonHolder")], true);
				} else {
					// otherwise just show full panel height
					height = $("#mainPanel").height();
				}
			} else {
				// if resize is being done for the pdf export, ensure chart is a sensible size
				height = 700;
				width = 700;
			}

			// make sure the chart isn't too big or small though (this helps things when it comes to download)
			$("#canvas-container")
				.width(Math.max(300,width))
				.height(Math.min(700, Math.max(300,height)));

			$("#qHolder .qImg").each(function() {
				$(this).css({
					"max-width": width - 10,
					"max-height": height - ($(this).parents("figure").find("figcaption").outerHeight(true) - $(this).parents("figure").find("figcaption").height())
				});
			});
		}

		this.loadAudio = function(currentQuestion, soundFile, transcript) {
			if (soundFile != undefined && soundFile != "") {
				$("#questionAudio" + currentQuestion).mediaPlayer({
					type	:"audio",
					source	:soundFile,
					width	:"100%"
				});

				// manually add a transcript button to the end of the audio bar
				if (transcript != undefined && transcript != '') {
					x_addAudioTranscript($("#questionAudio" + currentQuestion), transcript);
				}
			}
		};

		this.startQuestions = function() {
			$pageContents.data({
				'resultShown': false,
				'qNumTxt': x_currentPageXML.getAttribute("quesCount") != undefined ? x_currentPageXML.getAttribute("quesCount") : "Question {i} of {n}"
			});

			const feedback = x_currentPageXML.getAttribute("feedback") != undefined ? x_currentPageXML.getAttribute("feedback").trim() : "";
            let showfeedback = feedback !== '';
            if (x_currentPageXML.getAttribute("showfeedback") != undefined) {
                showfeedback = x_currentPageXML.getAttribute("showfeedback") == "true";
            }

			$pageContents.data('feedback', feedback);
			$pageContents.data('showfeedback', showfeedback);

			$("#canvas-container").hide();
            $("#qHolder").show();
			$("#checkBtn")
				.show()
				.button("disable");

			$pageContents.data('currentQuestion', 0);

			const questions = []; // array of questions to use (index)
			let numberOfQuestions = $(x_currentPageXML).children().children('opinionQuestion').length;
			$(x_currentPageXML).children().children('opinionQuestion').each(function() {
				if ($(this).children().length === 0) {
					// don't count questions with no answer options
					numberOfQuestions -= 1;
				}
			});

			if (numberOfQuestions === 0) {
				$("#qNo").html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noQ", "No questions have been added") + '</span>');
				$("#mainPanel fieldset").remove();

			} else {
				for (let i=0; i<$(x_currentPageXML).children().length; i++) {
					$(x_currentPageXML).children()[i].classId = i;
				}

				if (x_currentPageXML.getAttribute("order") == "random") {
					const questionNumbers = [];

					for (let i=0; i<numberOfQuestions; i++) {
						questionNumbers.push(i);
					}

					for (let i=0; i<numberOfQuestions; i++) {
						const questionNumber = Math.floor(Math.random() * questionNumbers.length);
						questions.push(questionNumbers[questionNumber]);
						questionNumbers.splice(questionNumber, 1);
					}
				} else {
					for (let i = 0; i < numberOfQuestions; i++) {
						questions.push(i);
					}
				}

				$pageContents.data('questions', questions);

				const weighting = x_currentPageXML.getAttribute("trackingWeight") != undefined ? x_currentPageXML.getAttribute("trackingWeight") : 1.0;

				XTSetPageType(x_currentPage, 'numeric', numberOfQuestions, weighting);

				this.loadQuestions();
			}

            x_pageContentsUpdated();
		};

		this.loadQuestions = function() {
            $("#checkBtn").button("disable");
			
            $pageContents.data('radioButtonQuestions', []);

			const pageMode = $pageContents.data('pageMode');
			const pageSize = $pageContents.data('pageSize');
			const currentQuestion = $pageContents.data('currentQuestion');
			const questions = $pageContents.data('questions');

			if (pageMode) {
				// list in pages
				if (pageSize === 1) {
					// one question per page
					$("#qNo").html($pageContents.data('qNumTxt').replace("{i}", currentQuestion + 1).replace("{n}", questions.length));
					$("#qHolder").html("");
					this.addQuestion(currentQuestion);
				} else {
					// multiple per page
					$("#qNo").html($pageContents.data('qNumTxt').replace("{i}", (currentQuestion + 1) + " - " + (Math.min(currentQuestion + pageSize, questions.length))).replace("{n}", questions.length));
					$("#qHolder").html("");
					for (let i=currentQuestion; i<Math.min(currentQuestion + pageSize, questions.length); i++) {
						this.addQuestion(i);
					}
				}

			} else {
				// all on one page
				$("#qNo").html("");
				$("#qHolder").html("");
				for (let i=currentQuestion; i<questions.length; i++) {
					this.addQuestion(i);
				}
			}
			
			this.checkButtonState();
		};

		this.addQuestion = function(q) {
			$("#qHolder").append('<fieldset class="noStyle"><legend id="qTxt' + q + '" class="qTxt"></legend><div id="questionAudio'+ q + '" class="questionAudio"></div><div id="sliderHolder' + q
					+ '" class="sliderHolder"><div id="labelHolder' + q + '" class="labelHolder"></div><div id="rangeHolder' + q + '" class="rangeHolder"></div></div><div class="qSeparator"><hr></div></fieldset>');
			this.loadQuestion(q);
		}

		this.checkButtonState = function() {
		    let checked = true;
		    $.each($pageContents.data('radioButtonQuestions'), function(key, value) {
		    	if (value == false) {
                    checked = false;
                }
			});
		    if (checked) {
                $("#checkBtn").button("enable");
			}
			const currQ = $pageContents.data('currentQuestion');
			if (currQ == 0) {
				$("#backBtn").button("disable");
			} else {
				$("#backBtn").button("enable");
			}
		};

		this.loadQuestion = function(currentQuestion) {
			const questions = $pageContents.data('questions');

			const $thisQ = $(x_currentPageXML).children().children('opinionQuestion')[questions[currentQuestion]];
			let classQ = $($thisQ).parent();
			let infoString = $thisQ.getAttribute("prompt");

			if ($thisQ.getAttribute("sound") != undefined && $thisQ.getAttribute("sound") != "") {
				this.loadAudio(currentQuestion, $thisQ.getAttribute("sound"), $thisQ.getAttribute('soundTranscript'));
			} else {
				$("#questionAudio" + currentQuestion).empty();
			}

			const url = $thisQ.getAttribute("image");

			if (url != undefined && url != "") {
				let newString = "";
				if ($thisQ.getAttribute("caption") != undefined && $thisQ.getAttribute("caption") != "") {
					newString += '<figure>';
				}
				newString += '<img class="qImg" src="' + x_evalURL(url) + '" class="opinionImg"';
				if ($thisQ.getAttribute("tip") != undefined && $thisQ.getAttribute("tip") != "") {
					newString += 'alt="' + $thisQ.getAttribute("tip") + '"';
				}
				newString += ' />';
				if ($thisQ.getAttribute("caption") != undefined && $thisQ.getAttribute("caption") != "") {
					newString += '<figcaption>' + $thisQ.getAttribute("caption") + '</figcaption></figure>';
				}
				infoString = newString + infoString;
			}

			$("#qTxt" + currentQuestion).html(x_addLineBreaks(infoString));

			$("#feedback").html("");

			if ($($thisQ).children().length == 0) {
				$("#sliderHolder" + currentQuestion)
						.addClass("noData")
						.html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noA", "No answer options have been added") + '</span>');
			} else {
				const correctOptions = [];
				const correctAnswer = [];
				let name;

				if ($thisQ.getAttribute("interactivity") == "radio-buttons") {
					const $optionHolder = $("#sliderHolder" + currentQuestion);
					$optionHolder.html('<div class="optionGroup"><input type="radio" name="option' + currentQuestion + '" /><label class="optionTxt"></label></div>');

					const $optionGroup = $optionHolder.find(".optionGroup");

					const radioButtonQuestions = $pageContents.data('radioButtonQuestions');
					radioButtonQuestions[currentQuestion] = false;
					$pageContents.data('radioButtonQuestions', radioButtonQuestions);

					const currentAnswers = [];
					$($thisQ).children().each(function () {
						currentAnswers.push(
							{
								text: this.getAttribute("text"),
								correct: this.getAttribute("correct")
							}
						);
					});

					let answers = $pageContents.data('answeredValues');
					let selected = -1;
					if (answers[currentQuestion] !== undefined)
					{
						selected = (currentAnswers.length-1) * answers[currentQuestion]/100;
					}

					$.each(currentAnswers, function (index, value) {
						let $thisOptionGroup, $thisOption, $thisOptionTxt;

						if (index != 0) {
							$thisOptionGroup = $optionGroup.clone().appendTo($optionHolder);
						} else {
							$thisOptionGroup = $optionGroup;
						}

						$thisOption = $thisOptionGroup.find("input");
						$thisOptionTxt = $thisOptionGroup.find(".optionTxt");

						correctOptions.push((index + 1) + "");
						correctAnswer.push(value.text);

						$thisOption
							.attr({
								"value": value.text,
								"id": "option" + currentQuestion + "_" + index
							})
							.change(function () {
								const radioButtonQuestions = $pageContents.data('radioButtonQuestions');
								radioButtonQuestions[currentQuestion] = true;
								$pageContents.data('radioButtonQuestions', radioButtonQuestions);
								opinion.checkButtonState();
							});
						$thisOption[0].score = index;

						$thisOptionTxt
							.attr("for", "option" + currentQuestion + "_" + index)
							.data("option", $thisOption)
							.html(x_addLineBreaks(value.text));
					});

					if (selected != -1) {
						let $thisOptions = $optionHolder.find("input");
						$($thisOptions[selected]).prop('checked', true);
						radioButtonQuestions[currentQuestion] = true;
						$pageContents.data('radioButtonQuestions', radioButtonQuestions);
					}

					name = x_GetTrackingTextFromHTML($thisQ.getAttribute("prompt"), "");

					if ($thisQ.getAttribute("name")) {
						name = $thisQ.getAttribute("name");
					}

				} else if($thisQ.getAttribute("interactivity") == null || $thisQ.getAttribute("interactivity") == "slider") {
					const $sliderHolder = $("#sliderHolder" + currentQuestion);
					$sliderHolder.html('<div id="labelHolder' + currentQuestion + '" class="labelHolder"><table class="none"><tr id="labelHolderRow' + currentQuestion + '"></tr></table></div><div id="rangeHolder' + currentQuestion + '"></div>');
					const $labelHolder = $("#labelHolderRow" + currentQuestion);
					const $rangeHolder = $("#rangeHolder" + currentQuestion);

					$labelHolder.html('<td class="labelCell"><a href="#" onclick="" class="optionTxt"></a></td>');
					const $optionTxt = $labelHolder.find(".optionTxt");
					const $optionCell = $labelHolder.find(".labelCell");

					const max = $($thisQ).children().length - 1;
					const numberOfOptions = max + 1;

					let answers = $pageContents.data('answeredValues');
					let selected = -1;
					if (answers[currentQuestion] !== undefined) {
						selected = max * answers[currentQuestion]/100;
					} else if ($thisQ.getAttribute("defaultSliderValue") != undefined) {
						const defaultVal = $thisQ.getAttribute("defaultSliderValue");
						selected = max * defaultVal/100;
					}

					$rangeHolder.html('<form id="form' + currentQuestion + '"> <input id="slider' + currentQuestion + '" aria-label="slider' + currentQuestion + '" type="range" min="0" max = "' + max + '" step="1" class="slider"/> </form> ');

					$.each($($thisQ).children(), function(index, value) {
						let $thisOptionTxt;

						if (index != 0) {
							$thisOptionTxt = $optionCell.clone().appendTo($labelHolder);
							$thisOptionTxt = $thisOptionTxt.find(".optionTxt");
							$thisOptionTxt.after(" ");
						} else {
							$thisOptionTxt = $optionTxt;
						}

						$thisOptionTxt
							.attr("for", "option" + index)
							.html($(value.getAttribute("text")).length < 1 ? '<p>' + x_addLineBreaks(value.getAttribute("text")) + '</p>' : x_addLineBreaks(value.getAttribute("text")));

						$thisOptionTxt[0].onclick = function() {
							$("#slider" + currentQuestion)[0].value = index;
						};

						correctOptions.push(index + 1 + "");
						correctAnswer.push(value.getAttribute("text"));
					});

					if (selected != -1) {
						$("#slider" + currentQuestion).val(selected);
					}

					const cellWidth = 100.0/numberOfOptions;
					$("td.labelCell").css("width", cellWidth + "%");
					$("#slider" + currentQuestion).css("width", 100-cellWidth + 2 +"%");
					$("#slider" + currentQuestion).css("margin-left", cellWidth/2 - 1 + "%");

					name = x_GetTrackingTextFromHTML($thisQ.getAttribute("prompt"), "");

					if ($thisQ.getAttribute("name")) {
						name = $thisQ.getAttribute("name");
					}
				}

				XTEnterInteraction(x_currentPage, questions[currentQuestion], 'numeric', name, correctOptions, correctAnswer, null, x_currentPageXML.getAttribute("grouping"), "opinionClass=" + classQ.attr("name"));
				$pageContents.data('checked', false);
			}
		};

		this.pageChanged = function() {
			$pageContents = $('#pageContents');

			if ($("#canvas-container").is(":visible")) {
				this.createGraphObject();
				this.drawGraph();
			}
		};

		this.trackQuestions = function(goingBack = false) {
			const pageSize = $pageContents.data('pageSize'),
				currentQuestion = $pageContents.data('currentQuestion'),
				questions = $pageContents.data('questions');

			if (pageSize > 1) {
				// track all questions on this page
				if (pageSize === questions.length) {
					for (let i=currentQuestion; i<questions.length; i++) {
						this.trackQuestion(i, goingBack);
					}
				} else {
                    for (let i=currentQuestion; i<Math.min(currentQuestion + pageSize, questions.length); i++) {
                        this.trackQuestion(i, goingBack);
                    }
                }
            } else {
				// only one question shown
                this.trackQuestion(currentQuestion, goingBack);
            }
            if (!goingBack && $pageContents.data('resultShown') == false) {
			    this.loadQuestions();
			} else {
				$("#backBtn").button("enable");
			}
		};

		this.trackQuestion = function(currentQuestion, goingBack) {
			const questions = $pageContents.data('questions'),
					currentQ = $(x_currentPageXML).children().children('opinionQuestion')[questions[currentQuestion]],
					options = $(currentQ).children(),
					l_options = [];

			// don't attempt to track if question has no answer options
			if (!$("#sliderHolder" + currentQuestion).hasClass("noData")) {
				let selected = 0;

				if (currentQ.getAttribute("interactivity") == null || currentQ.getAttribute("interactivity") == "slider") {
					selected = $('#slider' + currentQuestion)[0].valueAsNumber;
				} else if (currentQ.getAttribute("interactivity") == "radio-buttons" && $("#sliderHolder" + currentQuestion + " input:checked")[0] != null) {
					selected = $("#sliderHolder" + currentQuestion + " input:checked")[0].score;
				}
				for (let i = 0; i < options.length; i++) {
					l_options.push(i + "");
				}

				function calcPercentage(index, count) {
					let value;
					if (index == 0) {
						value = 0;
					} else if (index == count - 1) {
						value = 100;
					} else {
						value = index / (count - 1) * 100;
					}
					return value;
				}

				let currentQuestionValue = calcPercentage(selected, options.length);

				if (currentQ.getAttribute("scale") == "true") {
					currentQuestionValue = 100 - currentQuestionValue;
				}

				const l_answer = Math.round(currentQuestionValue * 10.0) / 10.0;
				const currentQuestionString = currentQuestion + "";

				const answeredValues = $pageContents.data('answeredValues');
				answeredValues[currentQuestionString] = currentQuestionValue;
				$pageContents.data('answeredValues', answeredValues);

				const diagramLabels = $pageContents.data('diagramLabels');
				diagramLabels[currentQuestion] = currentQ;
				$pageContents.data('diagramLabels', diagramLabels);

				const diagramAnswers = $pageContents.data('diagramAnswers');
				diagramAnswers[currentQuestion] = (Math.round(currentQuestionValue * 10.0) / 10.0);
				$pageContents.data('diagramAnswers', diagramAnswers);

				const result = {
					success: true,
					score: Math.round(currentQuestionValue * 10.0) / 10.0
				};

				XTExitInteraction(x_currentPage, questions[currentQuestion], result, l_options, l_answer, null, x_currentPageXML.getAttribute("trackinglabel"));
			}

			if (!goingBack) {
				// Continue to next question
				$pageContents.data('currentQuestion', $pageContents.data('currentQuestion') + 1);

				// If last question has been answered - show results, else continue
				if ($pageContents.data('currentQuestion') == questions.length) {
					this.trackOpinion();
					$pageContents.data('resultShown', true);
					opinion.showPrintButton();
				}
				x_pageContentsUpdated();
			}
		};

		this.trackOpinion = function() {
			// Last question answered - show results
			$("#qNo").html($pageContents.data("onCompletionText"));

            let myScore = 0;
			const answeredValues = $pageContents.data('answeredValues');
            for (let key in answeredValues) {
            	myScore += answeredValues[key];
            }
            myScore = Math.round(10 * myScore / Object.keys(answeredValues).length) / 10;

			$("#questionAudio, #feedback").empty();

			this.createGraphObject();

			// add main feedback
            if ($pageContents.data('showfeedback') && $pageContents.data('feedback') != '') {
                $("#feedback").append("<div id='mainFb' class='fbBlock'>" + x_addLineBreaks($pageContents.data('feedback')) + '</div>');
            }

			// add relevant tailored class feedback
			if ($(x_currentPageXML).children().children('classFeedback').length > 0) {
				$(x_currentPageXML).children().each(function() {
					const thisClass = this;
					$(thisClass).children('classFeedback').each(function() {
						let thisScore;
						for (let i=0; i<JSONGraph.classnames.length; i++) {
							if (thisClass.getAttribute('name') == JSONGraph.classnames[i]) {
								thisScore = JSONGraph.classvalues[i];
							}
						}

						if ((($.isNumeric(this.getAttribute('minScore')) && thisScore >= Number(this.getAttribute('minScore'))) || !$.isNumeric(this.getAttribute('minScore'))) && (($.isNumeric(this.getAttribute('maxScore')) && thisScore <= Number(this.getAttribute('maxScore'))) || !$.isNumeric(this.getAttribute('maxScore')))) {
							$('#feedback').append('<div class="fbBlock">' + (this.getAttribute('name') != '' ? '<h3>' + this.getAttribute('name') + '</h3>' : '') + x_addLineBreaks(this.getAttribute('feedbackTxt')) + '</div>');
						}
					});
				})
			}

			if ($('#feedback .fbBlock').length == 0) {
				$('#feedback').hide();
				if (x_currentPageXML.getAttribute("diagram") !== "true") {
					// Show default text if no graph and no feedback
					let noFeedback = "<p>You have completed all the questions.</p>";
					if (x_currentPageXML.getAttribute("noFeedbackNoGraph") != undefined) {
						noFeedback = x_currentPageXML.getAttribute("noFeedbackNoGraph");
					}
					$('#feedback').html(noFeedback);
				}
			}

            $("#qHolder").hide();
            $("#checkBtn").hide();

			this.drawGraph();

            XTSetPageScoreJSON(x_currentPage, myScore, JSON.stringify(JSONGraph), x_currentPageXML.getAttribute("trackinglabel"));
            $pageContents.data('checked', true);
		};

		this.drawGraph = function(redraw) {
			if (x_currentPageXML.getAttribute("diagram") !== "true") {
				if (x_currentPageXML.getAttribute("diagram") !== "true") {
					$("#canvas-container").show();
				} else {
					$('#canvas-container').hide();
				}
				if (redraw !== false) {
					this.sizeChanged();
				}
				this.createDiagram(JSONGraph);
			}
		}

		this.createGraphObject = function() {
            const classNames = [],
				classTitles = [],
				classValues = [],
				classWeighting = [];
			
			const diagramLabels = $pageContents.data('diagramLabels'),
				diagramAnswers = $pageContents.data('diagramAnswers');

            for (let i=0; i<diagramLabels.length; i++) {
                const q = diagramLabels[i];

                classNames[q.parentNode.classId] = q.parentNode.getAttribute("name");
                if (typeof q.parentNode.getAttribute("title") != "undefined" && q.parentNode.getAttribute("title") != "") {
					let tempTitle = $("<div>").html(q.parentNode.getAttribute("title"));
					tempTitle.find(".fav2").remove();
					tempTitle = tempTitle.text().trim();
                    classTitles[q.parentNode.classId] = tempTitle;
                } else {
                    classTitles[q.parentNode.classId] = classNames[q.parentNode.classId];
                }
                if (classValues[q.parentNode.classId] != undefined) {
                    classValues[q.parentNode.classId] = classValues[q.parentNode.classId] + (diagramAnswers[i]* diagramLabels[i].getAttribute("classWeight"));
                    classWeighting[q.parentNode.classId] = parseInt(classWeighting[q.parentNode.classId]) + parseInt(diagramLabels[i].getAttribute("classWeight"));
                } else {
                    classValues[q.parentNode.classId] =(diagramAnswers[i]* diagramLabels[i].getAttribute("classWeight"));
                    classWeighting[q.parentNode.classId] = diagramLabels[i].getAttribute("classWeight");
                }
            }
            for (let j=0; j<classValues.length;j++) {
                classValues[j] = classValues[j] / classWeighting[j];
            }

			JSONGraph = {
                label: x_currentPageXML.getAttribute("name"),
                classnames: classNames,
                classtitles: classTitles,
                classvalues: classValues
            };
        };

		this.createDiagram = function(graphObject) {
			const htmlToChar = function(h) {
				let temp = $("<div>").html(h);
				temp.find(".fav2").remove();
				temp = temp.text().trim();
				return temp;
			};
			const classTitles = graphObject.classtitles.map(function(a){return htmlToChar(a);});
			const classValues = graphObject.classvalues;

			let bgColourIn = "0x000000";
			if (x_currentPageXML.getAttribute("colour") != null) {
				bgColourIn = x_currentPageXML.getAttribute("colour");
			}

			const bgColour = x_hexToRgb(bgColourIn.substr(bgColourIn.length - 6), 0.5);
			const lnColour = x_hexToRgb(bgColourIn.substr(bgColourIn.length - 6), 1);
			const ctx = $("#diagram");

			let txtColour = $(".panelContent").css("color");
			let lineColour = txtColour;
			lineColour = lineColour.indexOf('rgba') === -1 ? lineColour.replace(')', ', 0.2)').replace('rgb', 'rgba') : lineColour;
			const fontSize = Math.max(12,parseInt(ctx.css("font-size"))*0.8);

			let tempPageName = $("<div>").html(x_currentPageXML.getAttribute("name"));
			tempPageName.find(".fav2").remove();

			const radarChart = new Chart(ctx, {
                type: 'radar',
                data: {
                    labels: opinion.wrapText(ctx, classTitles, Math.max(50, ctx.width()*0.15)),
                    datasets: [{
						label: htmlToChar(x_currentPageXML.getAttribute("name")),
                        data: classValues,
						backgroundColor: bgColour,
						borderColor: lnColour
                    }]
                },
				options: {
				  layout: {
					  padding: {
						  left: 10,
						  right: 10,
						  top: 10,
						  bottom: 10
						}
					},
					scale: {
						ticks: {
							suggestedMin: 0,
							suggestedMax: 100,
							fontSize: Math.max(10,fontSize*0.85)
						},
						pointLabels: {
							fontSize: fontSize,
							fontColor: txtColour
						},
						gridLines: {
							color: lineColour
						},
						angleLines: {
							color: lineColour
						}
					},
					legend: {
						labels: {
							fontSize: fontSize,
							fontColor: txtColour
						},
						display: x_currentPageXML.getAttribute("key") == 'false' ? false : true,
					},
					responsive: true,
					maintainAspectRatio: false
				}
            });

			// give canvas a description including data so it's accessible
			let chartDescr = "";
			for (let i=0; i<graphObject.classtitles.length; i++) {
				chartDescr += graphObject.classtitles[i] + " = " + graphObject.classvalues[i] + "%. "
			}

			$("#diagram").attr("title", chartDescr);
		};

		// function wraps the lines on the chart if they are long and might make the space available for the chart itself too small
		this.wrapText = function(ctx, labels, maxWidth) {
			for (let i=0; i<labels.length; i++) {
				const thisLabel = labels[i];
				const words = thisLabel.split(' ');
				const lines = [];
				let line = '';

				words.forEach(word => {
					const test = line ? `${line} ${word}` : word;

					if (ctx[0].getContext("2d").measureText(test).width > maxWidth) {
						lines.push(line);
						line = word;
					} else {
						line = test;
					}
				});

				if (line) {
					lines.push(line);
				}

				if (lines.length > 1) {
					labels.splice(i,1,lines);
				}
			}

			return labels;
		};

		this.init = function() {
			$pageContents = $('#pageContents');
			
			$pageContents.data({
				'pageMode': true, // true = questions split over more than one page / false = all questions on one page
				'pageSize': 0, // no. of questions per page
				'answeredValues': {},
				'diagramLabels': [],
				'diagramAnswers': []
			});
			
            if (x_currentPageXML.getAttribute("list") === "all" || x_currentPageXML.getAttribute("paging") === "false") {
				// all questions shown on single page
			    $pageContents.data('pageMode', false);
				// set page size to total number of items
				const numberOfQuestions = $(x_currentPageXML).children().children('opinionQuestion').length;
				$pageContents.data('pageSize', numberOfQuestions);
			} else {
				$pageContents.data('pageMode', true);
				if (x_currentPageXML.getAttribute("list") === "true") {
					// there is more than one per page - how many? make sure not higher than total no. questions
					$pageContents.data('pageSize', Math.min(x_currentPageXML.getAttribute("pagesize"), $(x_currentPageXML).children().children('opinionQuestion').length));
				} else {
					$pageContents.data('pageSize', 1);
				}
			}

			let txtString = x_currentPageXML.getAttribute("instructions") != undefined && x_currentPageXML.getAttribute("instructions") !== "" ? '<div id="txtContent">' + x_addLineBreaks(x_currentPageXML.getAttribute("instructions")) + '</div>' : "";
			if (x_currentPageXML.getAttribute("img") != undefined && x_currentPageXML.getAttribute("img") != "") {
				let newString = '';
				if (x_currentPageXML.getAttribute("caption") != undefined && x_currentPageXML.getAttribute("caption") != "") {
					newString += '<figure>';
				}
				newString += '<img class="opinionImg" src="' + x_evalURL(x_currentPageXML.getAttribute("img")) + '" ';
				if (x_currentPageXML.getAttribute("tip") != undefined && x_currentPageXML.getAttribute("tip") != "")
				{
					newString += 'alt="' + x_currentPageXML.getAttribute("tip") + '"';
				}
				newString += ' />';
				if (x_currentPageXML.getAttribute("caption") != undefined && x_currentPageXML.getAttribute("caption") != "") {
					newString += '<figcaption>' + x_currentPageXML.getAttribute("caption") + '</figcaption><figure>';
				}
				txtString += newString;
			}

			$("#textHolder").html(txtString);

			// panel position data is reversed as the property used to be called 'Align text' rather than 'Panel position'
			// send amended data to split screen function as otherwise layout will be reversed
			const attributes = {
				panelPosition: x_currentPageXML.getAttribute("align") !== "right" ? "right" : "left",
				pageTxt: x_currentPageXML.getAttribute("instructions"),  // xml property is instructions not text that is used in most page models
			}
			// set up split screen layout
			XENITH.SPLITSCREEN.init({"attributes": attributes});

            $pageContents.data({
				"onCompletionText": x_currentPageXML.getAttribute("onCompletion") != undefined ? x_currentPageXML.getAttribute("onCompletion") : "You have completed the questionnaire",
			});

			// back button
			$("#backBtn")
				.button({
					label: x_currentPageXML.getAttribute("backBtnText") != undefined ? x_currentPageXML.getAttribute("backBtnText") : "Back"
				})
				.click(function() {
					let pageSize = $pageContents.data('pageSize');
					let pageMode = $pageContents.data('pageMode');
					let currentQuestion = $pageContents.data('currentQuestion');

					if (currentQuestion >= pageSize) {
						$("#mainPanel").animate({ scrollTop: 0 }, "fast");
						$x_pageHolder.animate({ scrollTop: 0 }, "fast");

						const questions = $pageContents.data('questions');

						if (currentQuestion == questions.length) {
							opinion.showPrintButton(false);
							opinion.resetGraph();
							$("#qHolder").show();
							$("#checkBtn").show();
							$pageContents.data('resultShown', false);
						} else {
							if ($("#checkBtn").is(":enabled")) {
								opinion.trackQuestions(true);
							}
						}

						if (!pageMode) {
							currentQuestion = 0;
						} else if (questions.length % pageSize === 0 || currentQuestion !== questions.length) {
							currentQuestion -= pageSize;
						} else {
							currentQuestion -= questions.length % pageSize;
						}

						$pageContents.data('currentQuestion', currentQuestion);
						opinion.loadQuestions();
					}
				});

            // submit button
            $("#checkBtn")
				.button({
					label: x_currentPageXML.getAttribute("submitBtnText") != undefined ? x_currentPageXML.getAttribute("submitBtnText") : "Submit"
				})
				.click(function() {
          			$("#mainPanel").animate({ scrollTop: 0 }, "fast");
					$x_pageHolder.animate({ scrollTop: 0 }, "fast");
					opinion.trackQuestions();
				});

			// reset button
            $("#resetBtn")
				.button({
					label: x_currentPageXML.getAttribute("resetBtnText") != undefined ? x_currentPageXML.getAttribute("resetBtnText") : "Reset"
				})
				.click(function() {
					if ($(x_currentPageXML).children().length > 0) {	
						$pageContents.data({
							'answeredValues': {},
							'diagramLabels': [],
							'diagramAnswers': []
						});

						$x_pageHolder.scrollTop(0);
						$("#mainPanel").scrollTop(0);
						opinion.showPrintButton(false);
						opinion.startQuestions();
					}
				});

			// Uses new loadjs with experimental .path() method
			loadjs.path(x_templateLocation + 'common/js/');
			loadjs(['html2pdf.bundle.min.js'], {
				success: function() {
    				printAvailable = true;
				}
			});

			$("#printBtn")
				.button({
					label: x_currentPageXML.getAttribute("downloadBtnText") == undefined ? 'Download' : x_currentPageXML.getAttribute("downloadBtnText")
				})
				.click(async function() {
					// add the overlay & spinner while the pdf is generated & ensure it is all on screen
					$("#pageContents").prepend("<div id='print-overlay'><img id='print-overlay-spinner' src='" + x_templateLocation + "common/loading16.gif'></div>");
					$x_pageHolder.scrollTop(0);
					$("#mainPanel").scrollTop(0);

					// add a temporary title that will be included in the PDF
					$("#mainPanel").prepend('<div id="print-title"><h1>' + x_currentPageXML.getAttribute("name") + '</h1></div>');

					// temporarily remove the panel
					// the printing class ensures panel is in the best layout for pdf
					$("#mainPanel.panelContent")
						.data("panelStyle", $("#mainPanel.panelContent").hasClass("panel"))
						.removeClass("panel")
						.addClass("printing");

					await afterPaint();

					// temporarily turn off chart animations so the chart is fully drawn at the point that the pdf is created
					const oldAnimation = Chart.defaults.global.animation;
					Chart.defaults.global.animation = false;

					// resize the chart
					opinion.sizeChanged();

					await afterPaint();

					let fileName;
					if (x_currentPageXML.getAttribute("filename") != undefined && x_currentPageXML.getAttribute("filename").trim() != "") {
						fileName = x_currentPageXML.getAttribute("filename");
					} else {
						let pageTitle = $("<div>").html(x_currentPageXML.getAttribute("name"));
						pageTitle.find(".fav2").remove();
						fileName = pageTitle.text().trim();
					}

					let opt = {
						filename: fileName + '.pdf',
						html2canvas: { scale: 2 },
						jsPDF: {unit: 'in', format: 'a4', orientation: x_currentPageXML.getAttribute("fileOrientation") == undefined ? 'portrait' : x_currentPageXML.getAttribute("fileOrientation") }
					};

					html2pdf()
						.set(opt)
						.from($("#mainPanel")[0])
						.save()
						.catch(function() {
							alert(x_getLangInfo(x_languageData.find("downloadError")[0], "label", "Download error"));
						})
						.finally(function () {
							// reset the panel to its original appearance
							if ($("#mainPanel.panelContent").data("panelStyle")) {
								$("#mainPanel.panelContent").addClass("panel");
							}
							$("#mainPanel.panelContent").removeClass("printing");

							$("#print-title").remove();
							$("#print-overlay").remove();

							// resize the chart
							opinion.sizeChanged();

							// restore the chart animations
							Chart.defaults.global.animation = oldAnimation;
						})


				});

			// try to ensure that the html & chart has finished being redrawn before the pdf is generated - otherwise you can end up with stretched charts in pdf
			function nextFrame() {
				return new Promise(resolve => requestAnimationFrame(resolve));
			}
			async function afterPaint() {
				await nextFrame(); // layout
				await nextFrame(); // paint
			}

			$("#printBtn").hide();
			this.startQuestions();
			this.sizeChanged();
			x_pageLoaded();
		}

		this.showPrintButton = function (force) {
			if (force === false || !printAvailable) {
				$("#printBtn").hide();
			} else {
				if (x_currentPageXML.getAttribute('disableprinting') != undefined) {
					// old way of doing things - download button would only show if radar chart was shown
					if (x_currentPageXML.getAttribute('disableprinting') != 'true' && x_currentPageXML.getAttribute('diagram') !== 'true') {
						$("#printBtn").show();
					} else {
						$("#printBtn").hide();
					}
				} else {
					// new way of doing things - download button will show by default unless turned off
					if (x_currentPageXML.getAttribute('showDownload') != 'false') {
						$("#printBtn").show();
					} else {
						$("#printBtn").hide();
					}
				}
			}
		}

		this.resetGraph = function () {
			// Throw away iframe
			$("#mainPanel fieldset iframe").remove();

			// Reset feedback and diagram
			$("#feedback").remove();
			$("#canvas-container").hide();

			$("#mainPanel fieldset").prepend("<div id=\"feedback\" aria-live=\"polite\"></div>\n");
		}
	};

	opinion.init();
	
</script>

	<div id="infoHolder" class="splitScreen_B">

			<p id="qNo" aria-live="polite"></p>

			<fieldset class="noStyle">

				<div id="feedback" aria-live="polite"></div>

				<div id="canvas-container">
					<canvas id="diagram"></canvas>
				</div>

				<div id="wrapper">
					<div id="qHolder"></div>
					<div id="buttonHolder">
						<button id="printBtn"></button>
						<button id="resetBtn"></button>
						<button id="backBtn"></button>
						<button id="checkBtn"></button>
					</div>
				</div>

			</fieldset>

		</div>

	</div>

</div>
