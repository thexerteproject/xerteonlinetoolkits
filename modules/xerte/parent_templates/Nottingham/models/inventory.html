	// pageChanged & sizeChanged functions are needed in every model file
	// other functions for model should also be in here to avoid conflicts
	var inventory = new function() {
		let	$pageContents,
			chart,
			scoreType,
			chartInstance;
		
		// function called every time the page is viewed after it has initially loaded
		this.pageChanged = function() {
			$pageContents = $("#pageContents");
			chart = $pageContents.data("chart");
			scoreType = $pageContents.data("scoreType");
			chartInstance = $pageContents.data("chartInstance");

			this.refreshChart();
		}

		this.leavePage = function() {
			$pageContents.data("chartInstance", chartInstance);
		}
		
		// function called every time the size of the LO is changed
		this.sizeChanged = function() {
			// panel will be fixed height (100% of available height) if panel style is on, unless there is text above &/or below the panel
			XENITH.SPLITSCREEN.resizePanel();

			this.refreshChart();
		}
		
		this.init = function() {
			$pageContents = $("#pageContents");

			chart = x_currentPageXML.getAttribute("chartHide") == "true" ? false : x_currentPageXML.getAttribute("chartType");
			scoreType = chart === false ? false :
					chart === "pie" || chart === "doughnut" ? "relative percent" :
					chart === "radar" ? "individual percent" :
					x_currentPageXML.getAttribute("scoreType");

			$pageContents.data({
				"chart": chart,
				"scoreType": scoreType
			});
			
			// set fixed text fields and page layout
			$("#mainTxt").html(x_addLineBreaks(x_currentPageXML.getAttribute("instructions")));

			if (chart !== false) {
				$("#chartTitle").html(x_currentPageXML.getAttribute("chartTitle"));
			}

			// panel position data is reversed as the property used to be called 'Align text' rather than 'Panel position'
			// send amended data to split screen function as otherwise layout will be reversed
			const attributes = {
				panelPosition: x_currentPageXML.getAttribute("align") !== "right" ? "right" : "left",
				pageTxt: x_currentPageXML.getAttribute("instructions"),  // xml property is instructions not text that is used in most page models
			}
			// set up split screen layout
			XENITH.SPLITSCREEN.init({"attributes": attributes});
			
			const feedbackLabel = x_currentPageXML.getAttribute("feedbackLabel") == undefined ? "Feedback" : x_currentPageXML.getAttribute("feedbackLabel").trim();
			$("#qFeedbackTitle").html(feedbackLabel);
			
			const scoreQ = function($btn) {
				$("#optionHolder input").attr("disabled", "disabled");
				
				// add question weighted score to class score
				const currentQuestion = $(x_currentPageXML).children('invQuestion')[$pageContents.data("questions")[$pageContents.data("currentQ")]];
				
				$("#optionHolder input:checked").each(function() {
					// calculate and store new score for this option's class based on it's previous score and this option's weight
					const selectedOptionData = $(currentQuestion).children()[$(this).parent().index()];
					$pageContents.data("scores").splice(selectedOptionData.getAttribute("class"), 1, $pageContents.data("scores")[selectedOptionData.getAttribute("class")] + Number([selectedOptionData.getAttribute("weight")]));
				});
				
				$btn.attr("disabled", "disabled");
				$btn.hide().show(); // hack to take care of IEs inconsistent handling of clicks
			}
			
			// set up buttons - check & next buttons shown during quiz and restart button shown at end with chart
			$("#checkBtn")
				.button({
					label: x_currentPageXML.getAttribute("submitBtnText") == undefined ? "Submit" : x_currentPageXML.getAttribute("submitBtnText")
					})
				.attr("disabled", "disabled")
				.click(function() {
					// get feedback for selected options
					const currentQuestion = $(x_currentPageXML).children('invQuestion')[$pageContents.data("questions")[$pageContents.data("currentQ")]];
					let feedbackTxt = "";
					
					$("#optionHolder input:checked").each(function() {
					    // id is of the form optionX, where X is the index of the option
					    const index = parseInt(this.id.substr(6));
						const selectedOptionData = $(currentQuestion).children()[index];
						if (currentQuestion.getAttribute("questionFeedback") == "yes") {
							feedbackTxt += x_addLineBreaks(selectedOptionData.getAttribute("feedback")) + '<br/>';
						}
					});

					if (currentQuestion.getAttribute("questionFeedback") == "yes") {
						$("#qFeedbackTxt").html(feedbackTxt);
						$("#qFeedback").show();
					}
					
					$("#nextBtn").removeAttr("disabled");
					
					scoreQ($(this));
				});
			
			$("#nextBtn")
				.button({
					label: x_currentPageXML.getAttribute("nextBtnText") == undefined ? "Next" : x_currentPageXML.getAttribute("nextBtnText")
					})
				.attr("disabled", "disabled")
				.click(function() {
					const $this = $(this);
					const currentQuestion = $(x_currentPageXML).children('invQuestion')[$pageContents.data("questions")[$pageContents.data("currentQ")]];
					if (currentQuestion.getAttribute("questionFeedback") != "yes") {
						scoreQ($this);
					} else {
						$this.attr("disabled", "disabled");
						$this.hide().show(); // hack to take care of IEs inconsistent handling of clicks
					}
					
					$pageContents.data("currentQ", $pageContents.data("currentQ") + 1);
					if ($pageContents.data("currentQ") == $pageContents.data("questions").length) {
						inventory.feedback();
					} else {
						inventory.loadQ();
					}
				});
			
			$("#restartBtn")
				.button({
					label: x_currentPageXML.getAttribute("restartBtnText") == undefined ? "Restart" : x_currentPageXML.getAttribute("restartBtnText")
					})
				.click(function() {
					inventory.startQs();
				});

			if ($(x_currentPageXML).children('invQuestion').length == 0) {
				$("#infoHolder .panelContent").html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noQ", "No questions have been added") + '</span>');
			} else {
				// store data needed later - class info and string to base qNoTxt on
				const classes = x_currentPageXML.getAttribute("classes").split(",");
				if (classes[classes.length - 1] == "") {
					classes.splice(-1, 1);
				}
				if (classes.length > 10) {
					classes.splice(10);
				}
				
				const qNoTxt = x_currentPageXML.getAttribute("quesCount") == undefined ? "Question {i} of {n}" : x_currentPageXML.getAttribute("quesCount");
				
				$pageContents.data({
					"classes": classes,
					"qNoTxt": qNoTxt
				});
				
				this.startQs();
			}
			
			this.sizeChanged();
			x_pageLoaded();
		}
		
		this.startQs = function() {
			$("#pageContents .quiz").show();
			$("#feedbackTxt").empty();
			$("#pageContents .chart").hide();
			$("#nextBtn, #checkBtn").attr("disabled", "disabled");
			
			const questions = [],
				scores = [],
				totals = [],
				numQs = $(x_currentPageXML).children('invQuestion').length;
			let i;

			// get list of the order questions will be shown
			if (x_currentPageXML.getAttribute("order") == "random") {
				const qNums = [];
				for (i=0; i<numQs; i++) {
					qNums.push(i);
				}
				for (i=0; i<numQs; i++) {
					const qNum = Math.floor(Math.random() * qNums.length);
					questions.push(qNums[qNum]);
					qNums.splice(qNum, 1);
				}
				
			} else { // sequence
				for (i=0; i<numQs; i++) {
					questions.push(i);
				}
			}
			
			// reset stored scores
			for (i=0; i<$pageContents.data("classes").length; i++) {
				scores.push(0);
				totals.push(0);
			}
			
			$pageContents.data({
				"questions": questions,
				"currentQ": 0,
				"scores": scores,
				"totals": totals
			});
			
			this.loadQ();
		}
		
		this.loadQ = function() {
			const thisQ = $(x_currentPageXML).children('invQuestion')[$pageContents.data("questions")[$pageContents.data("currentQ")]];
			
			// set up question text, image, feedback text
			$("#qNo").html($pageContents.data("qNoTxt").replace("{i}", $pageContents.data("currentQ") + 1).replace("{n}", $pageContents.data("questions").length));
			
			let infoString = thisQ.getAttribute("prompt");
			const url = thisQ.getAttribute("image");

			if (url != undefined && url != "") {
				let newString = "";
				if (thisQ.getAttribute("caption") != undefined && thisQ.getAttribute("caption") != "") {
					newString += '<figure class="quizImgHolder">';
				} else {
					newString += '<div class="quizImgHolder">'
				}
				newString += '<img src="' + x_evalURL(url) + '" class="quizImg"';
				if (thisQ.getAttribute("tip") != undefined && thisQ.getAttribute("tip") != "") {
					newString += 'alt="' + thisQ.getAttribute("tip") + '"';
				}
				newString += ' />';
				if (thisQ.getAttribute("caption") != undefined && thisQ.getAttribute("caption") != "") {
					newString += '<figcaption>' + thisQ.getAttribute("caption") + '</figcaption></figure>';
				} else {
					newString += '</div>';
				}
				infoString = newString + infoString;
			}
			$("#qTxt").html(x_addLineBreaks(infoString));
			
			$("#qFeedback")
				.hide()
				.find("#qFeedbackTxt").html("");
			
			if ($(thisQ).children().length == 0) {
				$("#optionHolder").html('<span class="alert">' + x_getLangInfo(x_languageData.find("errorQuestions")[0], "noA", "No answer options have been added") + '</span>');
			} else {
				// set up radio buttons or check boxes
				const $optionHolder = $("#optionHolder");
				if (thisQ.getAttribute("type") == "Multiple Answer") {
					$optionHolder.html('<div class="optionGroup"><input type="checkbox" name="option" /><label class="optionTxt"></label></optionGroup>');
				} else {
					$optionHolder.html('<div class="optionGroup"><input type="radio" name="option" /><label class="optionTxt"></label></optionGroup>');
				}

				const $optionGroup = $optionHolder.find(".optionGroup");

				let tempTotal = [];
				for (let i=0; i<$pageContents.data("classes").length; i++) {
					tempTotal.push(0);
				}
				
				$(thisQ).children()
					.each(function(i) {
						let $thisOptionGroup, $thisOption, $thisOptionTxt;
						if (i != 0) {
							$thisOptionGroup = $optionGroup.clone().appendTo($optionHolder);
							$thisOption = $thisOptionGroup.find('input');
							$thisOptionTxt = $thisOptionGroup.find('.optionTxt');
						} else {
							$thisOptionGroup = $optionGroup;
							$thisOption = $thisOptionGroup.find('input');
							$thisOptionTxt = $thisOptionGroup.find('.optionTxt');
						}
						
						$thisOption
							.attr({
								"value": this.getAttribute("text"),
								"id": "option" + i
								})
							.change(function() {
								$("#qFeedback").hide();

								const $selected = $("#optionHolder input:checked"),
									$btn = thisQ.getAttribute("questionFeedback") == "yes" ? $("#checkBtn") : $("#nextBtn");

								if ($selected.length > 0) {
									$btn.removeAttr("disabled");
								} else {
									$btn.attr("disabled", "disabled");
								}
							})
							.focusin(function() {
								$thisOptionGroup.addClass("highlight");
							})
							.focusout(function() {
								$thisOptionGroup.removeClass("highlight");
							});
						
						let optTxt = x_addLineBreaks(this.getAttribute("text"));
						if (x_params.authorSupport == "true") {
							optTxt += ' <span class="alert">[' + $pageContents.data("classes")[this.getAttribute("class")] + " : " + this.getAttribute("weight") + ']</span>';
						}
						
						$thisOptionTxt
							.attr("for", "option" + i)
							.data("option", $thisOption)
							.html(optTxt);

						if (scoreType == "individual percent") {
							// need to keep track of max score possible for each class
							if (thisQ.getAttribute("type") === "Multiple Answer") {
								$pageContents.data("totals").splice(this.getAttribute("class"), 1, $pageContents.data("totals")[this.getAttribute("class")] + Number(this.getAttribute("weight")));
							} else {
								if (tempTotal[this.getAttribute("class")] < Number(this.getAttribute("weight"))) {
									tempTotal.splice(this.getAttribute("class"), 1, Number(this.getAttribute("weight")));
								}
							}
						}
					});

				if (scoreType == "individual percent" && thisQ.getAttribute("type") !== "Multiple Answer") {
					for (let i=0; i<tempTotal.length; i++) {
						if (tempTotal[i] > 0) {
							$pageContents.data("totals").splice(i, 1, $pageContents.data("totals")[i] + tempTotal[i]);
						}
					}
				}
			}

			if (thisQ.getAttribute("questionFeedback") != "yes") {
				$("#checkBtn").hide();
			} else {
				$("#checkBtn").show();
			}
			
			x_pageContentsUpdated();
		}

		this.feedback = function() {
			$("#pageContents .quiz").hide();
			$("#pageContents .chart, #feedbackTxt").show();

			if (x_currentPageXML.getAttribute("feedback") != undefined && x_currentPageXML.getAttribute("feedback").trim() != "") {
				$("#feedbackTxt").html(x_addLineBreaks(x_currentPageXML.getAttribute("feedback").trim()));
			} else {
				$("#feedbackTxt").html("");
			}

			const scores = $pageContents.data("scores");
			let maxScore = 0, // max value to show on bar / line graph
					i;

			if (scoreType == "relative percent") {
				// convert scores to percentage of total points scored
				// e.g. classA = 20%, classB = 65%, classC = 15%
				let totalScore = 0;
				for (i = 0; i < scores.length; i++) {
					totalScore += scores[i];
				}
				for (i = 0; i < scores.length; i++) {
					scores.splice(i, 1, Math.round((scores[i] / totalScore) * 100));
				}
				maxScore = 100;

			} else if (scoreType == "individual percent") {
				// coverts scores to percentage of total points possible for that class
				// e.g. classA = 70%, classB = 60%, classC = 20%
				const totals = $pageContents.data("totals");
				for (i = 0; i < scores.length; i++) {
					if (scores[i] > 0) {
						scores.splice(i, 1, Math.round((scores[i] / totals[i]) * 100));
					}
				}
				maxScore = 100;

			} else {
				// absolute - uses numeric scores
				// e.g. classA = 12, classB = 36, classC = 7
				for (i = 0; i < scores.length; i++) {
					maxScore = Math.max(maxScore, scores[i]);
				}
			}

			// add relevant tailored class feedback
			for (let i = 0; i < $(x_currentPageXML).children('invClassFeedback').length; i++) {
				const thisFb = $(x_currentPageXML).children('invClassFeedback')[i];
				const classScore = scores[thisFb.getAttribute('class')];

				if ((($.isNumeric(thisFb.getAttribute('minScore')) && classScore >= Number(thisFb.getAttribute('minScore'))) || !$.isNumeric(thisFb.getAttribute('minScore'))) && (($.isNumeric(thisFb.getAttribute('maxScore')) && classScore <= Number(thisFb.getAttribute('maxScore'))) || !$.isNumeric(thisFb.getAttribute('maxScore')))) {
					if (chart !== false) {
						$('#feedbackTxt').append('<div class="fbBlock">' + (thisFb.getAttribute('name') != '' ? '<h3>' + thisFb.getAttribute('name') + '</h3>' : '') + x_addLineBreaks(thisFb.getAttribute('feedbackTxt')) + '</div>');
					} else {
						$('#chartTitle').after('<div class="fbBlock">' + (thisFb.getAttribute('name') != '' ? '<h3>' + thisFb.getAttribute('name') + '</h3>' : '') + x_addLineBreaks(thisFb.getAttribute('feedbackTxt')) + '</div>');
						$('#chartContainer').hide();
					}
				}
			}

			$("#chartContainer").data({
				"scores": scores,
				"maxScore": maxScore
			});

			this.drawChart();
		}

		this.drawChart = function() {
			const scores = $("#chartContainer").data("scores");
			const maxScore = $("#chartContainer").data("maxScore");

			if (chart !== false) {
				// draw the chart
				let myChart = document.getElementById("chart");
				if (myChart.getContext) {

					this.sizeChart();

					// get the colours used by the chart
					// these can be shades of a single colour or a range of different colours
					let colours;
					if (x_currentPageXML.getAttribute("chartColourToggle") != "false" && x_currentPageXML.getAttribute("chartColour") != undefined && x_currentPageXML.getAttribute("chartColour").trim() != "") {
						// use colour(s) set in editor

						if (x_currentPageXML.getAttribute("chartColour").split(",").length > 1) {
							// multiple colours
							colours = x_currentPageXML.getAttribute("chartColour").split(",");
							for (i=0; i<colours.length; i++) {
								let tempColour = x_getColour(colours[i]);
								if (tempColour.substring(0, 2) == "0x") {
									tempColour = '#' + Array(9 - tempColour.length).join('0') + tempColour.substring(2);
								} else if (tempColour.substring(0, 1) !== "#") {
									tempColour = '#' + tempColour;
								}

								colours.splice(i, 1, tempColour);
							}

						} else {
							// single colour
							colours = x_getColour(x_currentPageXML.getAttribute("chartColour"));
							if (colours.substring(0, 2) == "0x") {
								colours = '#' + Array(9 - colours.length).join('0') + colours.substring(2);
							}
						}

					} else {
						// use a standard set of colours
						colours = [
							'#FF6384',
							'#36A2EB',
							'#FFCE56',
							'#4BC0C0',
							'#9966FF',
							'#FF9F40',
							'#C9CBCF',
							'#8BC34A',
							'#F44336',
							'#795548'
						];
					}
					colours = inventory.getColours(colours, scores.length);

					const txtColour = $("#mainTxt").css("color");
					$pageContents.data("txtColour", txtColour);

					const chartContext = myChart.getContext("2d");

					// if chart is being redrawn, first destroy the current chart instance
					if (chartInstance) {
						chartInstance.destroy();
					}

					switch (chart) {
						case "pie":
							this.drawPie(chartContext, scores, colours, txtColour);
							break;
						case "bar":
							this.drawBar(chartContext, scores, maxScore, colours, txtColour, x_currentPageXML.getAttribute("chartBarType"));
							break;
						case "line":
							this.drawLine(chartContext, scores, maxScore, colours, txtColour);
							break;
						case "polar":
							this.drawPolar(chartContext, scores, maxScore, colours, txtColour);
							break;
						case "doughnut":
							this.drawDoughnut(chartContext, scores, colours, txtColour);
							break;
						case "radar":
							this.drawRadar(chartContext, scores, maxScore, colours, txtColour);
					}

					// give canvas a description including data so it's accessible
					let chartDescr = x_currentPageXML.getAttribute("chartTitle") + ":";
					for (i=0; i<scores.length; i++) {
						chartDescr += " " + $pageContents.data("classes")[i] + " = " + scores[i];
						if (scoreType == "relative percent" || scoreType == "individual percent") {
							chartDescr += "%";
						}
						if (i != scores.length - 1) {
							chartDescr += ",";
						}
					}
					$("#chart").attr("title", chartDescr);

				} else {
					// canvas tag not supported - display error message and data in a table
					const errorTxt = x_getLangInfo(x_languageData.find("errorBrowser")[0], "label", "Your browser does not fully support this page type");
					const tableHolder = $("#infoHolder .chart");
					let table = '<table class="full">';

					tableHolder.find("#chartTitle, #chartContainer").hide();
					tableHolder.find("table, p").remove();

					for (i = 0; i < scores.length; i++) {
						table += '<tr><td>' + $pageContents.data("classes")[i] + '</td><td>' + scores[i];
						if (scoreType == "relative percent" || scoreType == "individual percent") {
							table += "%";
						}
						table += '</td></tr>';
					}
					table += '</table>';

					tableHolder.append('<p class="alert">' + errorTxt + '</p>' + table);
				}
			} else {
				$('#chartTitle, #chartContainer').hide();
			}
		}

		// chart.js canvases will fill its parent so ensure #chartContainer is correctly sized
		this.sizeChart = function() {
			$("#chartContainer").hide();
			let width = Math.floor($(".panelContent").width());
			width -= $(".qContent").outerWidth(true) - $(".qContent").width();
			width = Math.max(200, width);

			let height;
			if ($("#chartTitle").height() + $("#btnHolder").height() < $(".panelContent").height() / 3) {
				// if the rest of the content on the panel isn't too tall, try to fit chart in without scrolling
				height = Math.floor(x_getAvailableHeight([$(".panelContent"), $(".qContent")], [$("#chartTitle"), $("#btnHolder")], true));
			} else {
				// otherwise just show full panel height
				height = Math.floor($(".panelContent").height());
			}
			height = Math.max(300, height);

			$("#chartContainer")
					.width(width)
					.height(height)
					.show();
		}

		this.refreshChart = function() {
			if ($(".chart").is(":visible")) {
				if ($("#mainTxt").css("color") !== $pageContents.data("txtColour")) {
					// the text colour used in the chart no longer matches the text used on the screen (because theme changed?) - redraw chart
					this.drawChart();
				} else {
					this.sizeChart();
				}
			}
		}
		
		
		// --- FUNCTIONS TO DRAW CHARTS USING CHART.JS ---

		// ensure there are enough colours for the no. of classes
		this.getColours = function(colours, num) {
			if ($.isArray(colours) && colours.length >= num) {
				// it's already an array with enough colours in it - return unchanged
				return colours;

			} else {
				function lightenColour(hex, amount) {
					let r = parseInt(hex.substring(1, 3), 16);
					let g = parseInt(hex.substring(3, 5), 16);
					let b = parseInt(hex.substring(5, 7), 16);

					r = Math.round(r + (255 - r) * amount);
					g = Math.round(g + (255 - g) * amount);
					b = Math.round(b + (255 - b) * amount);

					return "#" +
							r.toString(16).padStart(2, "0") +
							g.toString(16).padStart(2, "0") +
							b.toString(16).padStart(2, "0");
				}

				if (!$.isArray(colours)) {
					// only one colour supplied - create shades of this colour
					const newColours = [];
					for (let i=0; i<num; i++) {
						newColours.push(lightenColour(colours, (i / (num - 1)) * 0.8));
					}
					return newColours;

				} else if (colours.length < num) {
					// it's already an array but doesn't have enough colours in it - add more shades

					// work out how many extra shades of each colour are needed
					const extraRequired = new Array(colours.length).fill(0);
					for (let i=0; i<num-colours.length; i++) {
						extraRequired.splice(i%colours.length, 1, extraRequired[i%colours.length]+1);
					}

					// & the order these will be added to the colours array
					const extras = [];
					for (let i=0; i<num-colours.length; i++) {
						extras.push(i%colours.length);
					}

					// now create the correct these extra shades
					const shadeCount = new Array(colours.length).fill(0);
					for (let i=0; i<extras.length; i++) {
						const colourIndex = extras[i];
						shadeCount[colourIndex]++;
						const amount = (shadeCount[colourIndex] / (extraRequired[colourIndex] + 1)) * 0.8;
						colours.push(lightenColour(colours[colourIndex], amount));
					}

					return colours;
				}
			}
		}

		this.drawBar = function(canvas, scores, maxScore, colours, txtColour, alignment) {
			const horizontal = alignment == "horizontal";
			// get axis labels (if required)
			let xAxis = x_currentPageXML.getAttribute("chartAxisTitle") === "true" && x_currentPageXML.getAttribute("chartAxisXTitle") != undefined && x_currentPageXML.getAttribute("chartAxisXTitle").trim() != "" ? x_currentPageXML.getAttribute("chartAxisXTitle").trim() : "";
			let yAxis = x_currentPageXML.getAttribute("chartAxisTitle") === "true" ? true : "";
			if (yAxis) {
				if (scoreType === "absolute" && x_currentPageXML.getAttribute("chartAxisYTitle") != undefined && x_currentPageXML.getAttribute("chartAxisYTitle").trim() != "") {
					// default = "Score"
					yAxis = x_currentPageXML.getAttribute("chartAxisYTitle").trim();
				} else if (scoreType !== "absolute" && x_currentPageXML.getAttribute("chartAxisYTitle2") != undefined && x_currentPageXML.getAttribute("chartAxisYTitle2").trim() != "") {
					// default = "Score (%)"
					yAxis = x_currentPageXML.getAttribute("chartAxisYTitle2").trim();
				} else {
					yAxis = "";
				}
			}

			let xTicks = {
				fontColor: txtColour
			};
			let yTicks = {
				beginAtZero: true,
				max: maxScore,
				fontColor: txtColour
			};

			if (horizontal === true) {
				[xAxis, yAxis] = [yAxis, xAxis];
				[xTicks, yTicks] = [yTicks, xTicks];
			}

			chartInstance = new Chart(canvas, {
				type: horizontal === true ? 'horizontalBar' : 'bar',
				data: {
					labels: $pageContents.data("classes"),
					datasets: [{
						data: scores,
						backgroundColor: colours,
						borderColor: colours,
						borderWidth: 1
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					legend: {
						display: false
					},
					scales: {
						yAxes: [{
							scaleLabel: {
								display: yAxis !== "",
								labelString: yAxis,
								fontColor: txtColour
							},
							ticks: yTicks,
							gridLines: {
								display: horizontal !== true
							}
						}],
						xAxes: [{
							scaleLabel: {
								display: xAxis !== "",
								labelString: xAxis,
								fontColor: txtColour
							},
							ticks: xTicks,
							gridLines: {
								display: horizontal === true
							}
						}]
					}
				}
			});
		}

		this.drawLine = function(canvas, scores, maxScore, colours, txtColour) {
			// get axis labels (if required)
			const xAxis = x_currentPageXML.getAttribute("chartAxisTitle") === "true" && x_currentPageXML.getAttribute("chartAxisXTitle") != undefined && x_currentPageXML.getAttribute("chartAxisXTitle").trim() != "" ? x_currentPageXML.getAttribute("chartAxisXTitle").trim() : "";
			let yAxis = x_currentPageXML.getAttribute("chartAxisTitle") === "true" ? true : "";
			if (yAxis) {

				} else if (scoreType !== "absolute" && x_currentPageXML.getAttribute("chartAxisYTitle2") != undefined && x_currentPageXML.getAttribute("chartAxisYTitle2").trim() != "") {
					// default = "Score (%)"
					yAxis = x_currentPageXML.getAttribute("chartAxisYTitle2").trim();
				} else {
					yAxis = "";
				}
			}

			chartInstance = new Chart(canvas, {
				type: 'line',
				data: {

						data: scores,
						borderColor: txtColour,
						borderWidth: 2,
						pointRadius: 5,
						pointBackgroundColor: colours,
						pointBorderColor: colours,
						fill: false,
						lineTension: 0
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					legend: {
						display: false
					},
					scales: {
						yAxes: [{
							scaleLabel: {
								display: yAxis !== "",
								labelString: yAxis,
								fontColor: txtColour
							},
							ticks: {
								beginAtZero: true,
								max: maxScore,
								fontColor: txtColour
							}
						}],
						xAxes: [{
							scaleLabel: {
								display: xAxis !== "",
								labelString: xAxis,
								fontColor: txtColour
							},
							ticks: {
								fontColor: txtColour
							},
							gridLines: {
								display: false
							}
						}]
					}
				}
			});
		}

		this.drawPie = function(canvas, scores, colours, txtColour) {
			chartInstance = new Chart(canvas, {
				type: 'pie',
				data: {
					labels: $pageContents.data("classes"),
					datasets: [{
						data: scores,
						backgroundColor: colours,
						borderColor: "#FFFFFF",
						borderWidth: 2
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					legend: {
						display: true,
						position: 'top',
						labels: {
							fontColor: txtColour
						}
					}
				},
				plugins: [{
					// add some padding below the legend so the chart isn't squashed up
					beforeInit: function(chart) {
						const fit = chart.legend.fit;
						chart.legend.fit = function() {
							fit.bind(chart.legend)();
							this.height += 10; // px
						};
					}
				}]
			});
		}

		this.drawPolar = function(canvas, scores, maxScore, colours, txtColour) {

		this.drawRadar = function(canvas, scores, maxScore, colours, txtColour) {
			chartInstance = new Chart(canvas, {
				type: 'radar',
				data: {
					labels: $pageContents.data("classes"),
					datasets: [{
						data: scores,

						borderWidth: 2,
						pointBackgroundColor: colours[0],
					}]
				},
				options: {
					responsive: true,
					maintainAspectRatio: false,
					legend: {
						display: false
					},
					scale: {
						ticks: {
							beginAtZero: true,
							min: 0,
							max: maxScore,
						},
						pointLabels: {
							fontColor: txtColour,
							fontSize: 13
						},
					}
				}
			});
		}
	}
	
	inventory.init();
	
</script>
